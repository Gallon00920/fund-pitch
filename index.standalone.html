<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junson Capital | Fund Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Junson Capital brand: navy #1A2445, deep navy #121C3A, blue #081951, gold #DAB56E (from junsoncapital.com).
   The firm's site typeface is Masiva (commercial); Outfit is the closest free geometric substitute. */
:root{
  --navy:#1A2445; --navy-2:#121C3A; --deep:#081951; --ink:#141b33; --muted:#5d6580; --line:#e4e6ee;
  --bg:#f6f6f9; --card:#ffffff; --gold:#DAB56E; --pos:#1f7a5a; --neg:#b4443a; --neg-bg:#fbf1ef;
  --serif:'Outfit','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --sans:'Outfit','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
}
html[lang="zh-Hant"]{--serif:'Outfit','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;--sans:var(--serif)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{overscroll-behavior-x:none}   /* stop the browser swipe-back / swipe-forward gesture (Chrome, Edge, Firefox) */
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* NAV */
nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:.3s;background:transparent}
nav.solid{background:rgba(26,36,69,.97);box-shadow:0 1px 0 rgba(255,255,255,.06)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.logo{display:flex;align-items:center;gap:16px;color:#fff}
.logo img{height:38px;width:auto;display:block}
.logo small{font-size:10px;letter-spacing:3px;color:#b9bfd1;text-transform:uppercase;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;line-height:1.4}
.links{display:flex;gap:34px;font-size:12.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#fff}
.links a{position:relative;padding:6px 0;transition:color .2s}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.links a:hover,.links a.on{color:var(--gold)}
.links a:hover::after,.links a.on::after{transform:none}
.nav-right{display:flex;align-items:center;gap:20px}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:8px 2px;cursor:pointer;transition:color .2s}
.lang-btn:hover,.lang.open .lang-btn{color:var(--gold)}
.lang-btn svg{flex:none}
.lang-btn .chev{transition:transform .25s;opacity:.8}
.lang.open .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 14px);min-width:190px;background:#fff;box-shadow:0 18px 40px -12px rgba(18,28,58,.45);padding:8px 0;list-style:none;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s;border-top:2px solid var(--gold)}
.lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto}
.lang-menu button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;padding:11px 20px;font-family:var(--sans);font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.lang-menu button small{font-size:11px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.lang-menu button:hover{background:#f4f2ec}
.lang-menu button.on{color:var(--navy);font-weight:600}
.lang-menu button.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:auto}
.lang-menu button.on small{display:none}
.btn{display:inline-block;white-space:nowrap;padding:12px 26px;font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;border:1px solid var(--gold);color:#fff;transition:.25s;cursor:pointer;background:none;font-family:var(--sans)}
.btn:hover{background:var(--gold);color:var(--navy)}

/* HERO */
.hero{position:relative;min-height:86vh;display:flex;align-items:flex-end;color:#fff;padding:150px 0 90px;overflow:hidden;
  background:radial-gradient(1200px 600px at 80% 20%,#2c3a6a 0%,transparent 60%),linear-gradient(160deg,#1A2445 0%,#0f1733 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:80px 80px;
  mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.hero svg.lines{position:absolute;right:-60px;top:90px;width:60%;opacity:.5}
.hero .wrap{position:relative;width:100%}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:40px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,5.6vw,76px);line-height:1.08;max-width:920px;letter-spacing:-.5px}
.hero h1 b{font-weight:700}
.hero p{margin-top:26px;max-width:620px;font-size:17px;line-height:1.75;color:#c3c8d8;font-weight:300}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:70px;border-top:1px solid rgba(255,255,255,.14)}
.hero-stats div{padding:26px 24px 0 0}
.hero-stats b{display:block;font-family:var(--serif);font-size:clamp(30px,4.4vw,52px);font-weight:600;line-height:1.1}
.hero-stats span{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#9aa2ba}

/* SECTION */
section.funds{padding:110px 0 120px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:44px}
.sec-head>div{flex:none}
.sec-head h2{white-space:nowrap;font-family:var(--serif);font-weight:600;font-size:44px;color:var(--navy);line-height:1.1}
.sec-head p{color:var(--muted);max-width:460px;line-height:1.75;font-size:15px}

/* TABS */
.tabbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:38px}
.tabs{display:flex;gap:44px}
.tab{position:relative;padding:18px 0;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--sans);font-weight:500}
.tab .count{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:8px;border-radius:11px;background:var(--line);font-size:11px;color:var(--navy)}
.tab.active{color:var(--navy)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--navy)}
.tab.active .count{background:var(--navy);color:#fff}
.tab-desc{font-size:13px;color:var(--muted);margin-top:18px}

/* CAROUSEL: free horizontal scroll, mouse drag, keyboard */
.track-outer{overflow-x:auto;overflow-y:hidden;margin:0 -32px;padding:6px 32px 30px;scroll-padding-inline:32px;
  scroll-snap-type:x proximity;scrollbar-width:none;cursor:grab;outline:none;overscroll-behavior-x:none}
.track-outer::-webkit-scrollbar{display:none}
.track-outer.dragging{cursor:grabbing;scroll-snap-type:none}
.track-outer.dragging .card{pointer-events:none}
.track-outer:focus-visible{box-shadow:inset 0 0 0 2px rgba(218,181,110,.5)}
/* Shared row grid: every card spans the same 10 rows (tag, name, manager, KPIs, strategy, returns label,
   chart, drawdown label, drawdown, footer) via subgrid, so matching content lines up across cards. */
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px)/3);grid-template-rows:repeat(10,auto);column-gap:24px;row-gap:0;user-select:none}
.card{scroll-snap-align:start}
.card{grid-row:span 10;display:grid;grid-template-rows:subgrid;row-gap:0;background:var(--card);border:1px solid var(--line);transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 50px -24px rgba(26,36,69,.35)}
.card-top{grid-row:span 3;display:grid;grid-template-rows:subgrid;row-gap:0;align-items:start;padding:30px 30px 24px;background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
.card-top::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:1px solid rgba(218,181,110,.35);border-radius:50%}
.tag{display:inline-block;justify-self:start;align-self:start;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;padding:5px 10px;border:1px solid rgba(218,181,110,.6);color:var(--gold);margin-bottom:18px}
.card h3{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.2;align-self:start}
.card .mgr{font-size:12px;color:#aab1c6;letter-spacing:1px;margin-top:8px;text-transform:uppercase;align-self:end}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}
.kpis div{padding:18px 16px 16px 30px}
.kpis div+div{border-left:1px solid var(--line);padding-left:16px}
.kpis b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy);white-space:nowrap}
.kpis span{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.card-body{grid-row:span 6;display:grid;grid-template-rows:subgrid;row-gap:0;padding:22px 30px 26px}
.strategy{font-size:14px;line-height:1.7;color:#334155;align-self:start}
.mini-label{align-self:end;display:flex;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.mini-label span{white-space:nowrap}
.mini-label span+span{letter-spacing:.2px;text-transform:none;color:var(--navy);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:center;gap:6px;height:90px;position:relative;margin-bottom:18px}
.bars::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #cfd7e2}
.bar{flex:1;height:100%;position:relative}
.bar i{position:absolute;left:0;right:0;transition:height .8s cubic-bezier(.22,.8,.2,1)}
.bar i.p{bottom:50%;background:var(--navy)}
.bar i.n{top:50%;background:var(--neg)}
.bar.ytd i.p{background:var(--gold)}
.bar em{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;color:var(--muted)}
.bar:hover::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;padding:3px 6px;white-space:nowrap;z-index:2}

/* drawdown */
.dd{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:#fafbfd}
.dd div{padding:12px 14px}
.dd div+div{border-left:1px solid var(--line)}
.dd span{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dd b{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--neg)}
.dd b.none{color:var(--pos);font-size:15px;font-family:var(--sans)}
.dd small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.dd-xl div{padding:20px 22px}
.dd-xl b{font-size:30px}
.dd-xl b.none{font-size:18px}
.dd-xl small{font-size:12.5px}

.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;align-self:end;padding-top:18px;border-top:1px solid var(--line)}
.recent{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:22px;align-self:start}
.recent th{text-align:left;font-weight:500;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:0 0 7px;border-bottom:1px solid var(--navy)}
.recent td{padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.recent th:last-child,.recent td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.liq{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.liq::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.liq.semi::before{background:var(--gold)}
.more{position:relative;display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--navy);font-weight:600;font-family:var(--sans);white-space:nowrap;background:none;border:none;cursor:pointer;
  padding:16px 20px;margin:-16px -20px;transition:color .2s}   /* padding enlarges the click area; negative margin keeps the text where it was */
.more::before{content:"";position:absolute;inset:-4px -4px -10px -24px}   /* reach a bit further left and down, invisible */
.more svg{transition:transform .2s}
.more:hover,.more:focus-visible{color:var(--gold-ink,#a8823d)}
.more:hover svg{transform:translateX(3px)}
.progress{height:2px;background:var(--line);margin-top:10px;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);transition:.6s cubic-bezier(.22,.8,.2,1)}

/* DRAWER */
.scrim{position:fixed;inset:0;background:rgba(18,28,58,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.35s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:#fff;z-index:90;transform:translateX(100%);transition:transform .45s cubic-bezier(.22,.8,.2,1);overflow-y:auto}
.drawer.on{transform:none}
.d-head{background:var(--navy);color:#fff;padding:44px 48px 36px;position:relative}
.d-head h3{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin-top:4px}
.d-head p{color:#aab1c6;font-size:13px;margin-top:10px;letter-spacing:1px;text-transform:uppercase}
.close{position:absolute;right:28px;top:26px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;cursor:pointer;font-size:18px}
.close:hover{background:var(--gold);border-color:var(--gold)}
.d-body{padding:36px 48px 60px}
.d-body h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:32px 0 14px}
.d-body h4:first-child{margin-top:0}
.d-body p{font-size:15px;line-height:1.8;color:#334155}
.d-body .dd-note{font-size:13px;color:var(--muted);margin-top:10px}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.facts div{padding:16px 0;border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){padding-right:20px}
.facts span{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.facts b{font-weight:500;font-size:15px;color:var(--navy);line-height:1.5}
table.perf{width:100%;border-collapse:collapse;font-size:14px}
table.perf th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--navy)}
table.perf th:last-child,table.perf td:last-child{text-align:right}
table.perf td{padding:11px 0;border-bottom:1px solid var(--line)}
td.pos{color:var(--pos);font-weight:500} td.neg{color:var(--neg);font-weight:500}
.note{font-size:12px!important;color:var(--muted)!important;line-height:1.6!important;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}

/* FOOTER */
footer{background:#121C3A;color:#71839e;font-size:12px;line-height:1.8;padding:44px 0}
footer .wrap{display:grid;grid-template-columns:1fr 2fr;gap:60px}

.reveal{opacity:0;transform:translateY(24px);transition:1s cubic-bezier(.22,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

html:not([lang="en"]) .tab,html:not([lang="en"]) .links,html:not([lang="en"]) .eyebrow{letter-spacing:2px}
html:not([lang="en"]) .hero h1{line-height:1.25}

@media (max-width:1000px){.track{grid-auto-columns:calc((100% - 24px)/2)}.links{display:none}}
@media (max-width:680px){
  .wrap{padding:0 16px}.track-outer{margin:0 -16px;padding:6px 16px 30px}
  .track{grid-auto-columns:88%}.sec-head{flex-direction:column;align-items:flex-start}.sec-head h2{font-size:34px}
  .tabbar{flex-direction:column;align-items:flex-start;gap:12px;padding-bottom:12px}.tabs{gap:24px}
  .d-head,.d-body{padding-left:24px;padding-right:24px}footer .wrap{display:block}
  .logo small{display:none}
}
</style>
</head>

/* ---------- helpers ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let lang="en", tab="liquid";
try{ const s=localStorage.getItem("jc-lang"); if(UI[s]) lang=s }catch(e){}
const t=k=>UI[lang][k];
const L=o=>o?(o[lang]||o.en):"";
const zh=()=>lang!=="en";
const fmt=v=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(2)+"%";
const ym=s=>{const [y,m]=s.split("-");return zh()?`${y}年${+m}月`:`${MON[m-1]} ${y}`};
const money=bn=>zh()?`${+(bn*10).toFixed(1)}亿美元`.replace("亿",lang==="tc"?"億":"亿"):`US$${bn.toFixed(bn<10?2:1)}bn`;
const perLabel=([y,,k,m])=>k==="ytd"?(zh()?`${y} YTD (至${m}月)`:`${y} YTD (to ${MON[m-1]})`):k==="p"?(zh()?`${y} (${m}月起)`:`${y} (from ${MON[m-1]})`):y;
const ann=p=>{const f=p.filter(x=>!x[2]);if(!f.length)return null;return(Math.pow(f.reduce((a,x)=>a*(1+x[1]/100),1),1/f.length)-1)*100};
const liqTxt=f=>f.liq?L(f.liq):t("daily");
const veh=f=>f.vehicle==="private"?t("private"):f.vehicle;

function ddText(f){                                     // max drawdown as a plain sentence, same style as other drawer text
  const d=f.dd, z=zh(), c=z?"：":": ", sep=z?"；":". ", end=z?"。":".";
  const wm=`${d.since2020?t("wm20"):t("wm")}${c}${ym(d.wm[1])}${z?" ":", "}${fmt(d.wm[0])}`;
  const wy=d.wy?`${t("wy")}${c}${d.wy[1]}${z?"年 ":", "}${fmt(d.wy[0])}`:t("noNeg");
  return wm+(d.wy===false?"":sep+wy)+end+(d.extra?(z?"":" ")+L(d.extra):"");   // wy:false = leave the worst-year sentence out
}

const track=document.getElementById("track"), prog=document.getElementById("prog");

function cardHTML(f,i){
  const max=Math.max(...f.perf.map(x=>Math.abs(x[1])));
  const bars=f.perf.map(p=>`<div class="bar ${p[2]==="ytd"?"ytd":""}" data-v="${perLabel(p)}: ${fmt(p[1])}"><i class="${p[1]>=0?"p":"n"}" style="height:0" data-h="${Math.abs(p[1])/max*50}%"></i><em>${p[2]==="ytd"?"YTD":"'"+p[0].slice(2)}</em></div>`).join("");
  const a=ann(f.perf), last=f.perf.at(-1);
  return `<article class="card">
    <div class="card-top"><span class="tag">${L(f.tag)}</span><h3>${f.name}</h3><div class="mgr">${L(f.mgr)} · ${veh(f)}</div></div>
    <div class="kpis">
      <div><b>${money(f.aum)}</b><span>${t("aum")}</span></div>
      <div><b>${f.inception.slice(0,4)}</b><span>${t("inception")}</span></div>
      <div><b>${a!==null?fmt(a):"—"}</b><span>${t("ann")}</span></div>
    </div>
    <div class="card-body">
      <p class="strategy">${L(f.strategy)}</p>
      <div class="mini-label"><span>${t("annual")}</span><span>${fmt(last[1])} ${perLabel(last)}</span></div>
      <div class="bars">${bars}</div>
      <div class="mini-label"><span>${t("recent5")}</span></div>
      <table class="recent"><tr><th>${t("period")}</th><th>${t("ret")}</th></tr>${f.perf.slice(-5).reverse().map(p=>`<tr><td>${perLabel(p)}</td><td class="${p[1]>=0?"pos":"neg"}">${fmt(p[1])}</td></tr>`).join("")}</table>
      <div class="card-foot"><span class="liq ${tab!=="liquid"?"semi":""}">${liqTxt(f)}</span>
        <button class="more" data-n="${i}">${t("view")} <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7h10M8 3l4 4-4 4"/></svg></button></div>
    </div></article>`;
}

function renderCards(keepPos){
  const x=scroller.scrollLeft;
  track.innerHTML=FUNDS[tab].map(cardHTML).join("");
  document.getElementById("tabDesc").textContent=t(tab==="liquid"?"descLiquid":"descIlliquid");
  requestAnimationFrame(()=>setTimeout(()=>track.querySelectorAll(".bar i").forEach(b=>b.style.height=b.dataset.h),80));

}
function updateProg(){

  prog.style.width=Math.min(100,scroller.clientWidth/w*100)+"%";

}

/* mouse drag with momentum (touch uses native scrolling) */
let drag=null, glide=0, justDragged=false;
scroller.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse"||e.button!==0||e.target.closest("button"))return;
  cancelAnimationFrame(glide);
  drag={x:e.clientX,start:scroller.scrollLeft,lastX:e.clientX,lastT:performance.now(),v:0,moved:false};
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;
  if(!drag.moved&&Math.abs(dx)>4){drag.moved=true;scroller.classList.add("dragging")}
  if(!drag.moved)return;
  const now=performance.now(), dt=Math.max(1,now-drag.lastT);
  drag.v=0.8*((drag.lastX-e.clientX)/dt)+0.2*drag.v;   // px per ms, smoothed
  drag.lastX=e.clientX; drag.lastT=now;
  scroller.scrollLeft=drag.start-dx;
});
addEventListener("pointerup",()=>{
  if(!drag)return;
  const {moved}=drag; let v=drag.v*16; drag=null;
  if(!moved)return;
  justDragged=true; setTimeout(()=>justDragged=false,0);
  (function step(){                                     // decelerate, then let snap settle
    if(Math.abs(v)<0.5){scroller.classList.remove("dragging");return}
    scroller.scrollLeft+=v; v*=0.94; glide=requestAnimationFrame(step);
  })();
});
scroller.addEventListener("click",e=>{if(justDragged){e.preventDefault();e.stopPropagation()}},true);

/* Block trackpad swipe-to-go-back / forward (also covers Safari, which ignores overscroll-behavior for this).
   Horizontal wheel movement is allowed only while the fund carousel can still scroll that way. */
document.addEventListener("wheel",e=>{
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;            // vertical scrolling: leave alone
  const sc=e.target.closest&&e.target.closest("#scroller");
  if(sc){
    const max=sc.scrollWidth-sc.clientWidth;
    const canScroll=e.deltaX<0?sc.scrollLeft>0:sc.scrollLeft<max-1;
    if(canScroll)return;                                        // carousel handles it natively
  }
  e.preventDefault();                                           // at an edge or outside the carousel: swallow it
},{passive:false});

/* keyboard: hold ← / → to slide continuously; Home / End jump */
let keyDir=0, keyLoop=0, kv=0;
function keySlide(){                                    // held: steady speed; released: glide out
  if(keyDir) kv=keyDir*Math.max(Math.abs(kv),18); else kv*=0.9;
  if(Math.abs(kv)<0.5){kv=0;scroller.classList.remove("dragging");return}
  scroller.scrollLeft+=kv; keyLoop=requestAnimationFrame(keySlide);
}
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeD();return}
  if(drawer.classList.contains("on")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault();
    const d=e.key==="ArrowRight"?1:-1;
    if(keyDir!==d){keyDir=d;if(Math.sign(kv)!==d)kv=0;cancelAnimationFrame(glide);scroller.classList.add("dragging");cancelAnimationFrame(keyLoop);keySlide()}
  }
  if(e.key==="Home"&&document.activeElement===scroller){e.preventDefault();scroller.scrollTo({left:0,behavior:"smooth"})}
  if(e.key==="End"&&document.activeElement===scroller){e.preventDefault();scroller.scrollTo({left:scroller.scrollWidth,behavior:"smooth"})}
});
addEventListener("keyup",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft")keyDir=0});
addEventListener("blur",()=>keyDir=0);

/* drawer */
const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim");
let openFund=null;
track.addEventListener("click",e=>{const b=e.target.closest(".more");if(b)openD(FUNDS[tab][b.dataset.n])});
function openD(f){
  const keep=openFund===f?drawer.scrollTop:0; openFund=f;
  drawer.innerHTML=`<div class="d-head"><button class="close" onclick="closeD()" aria-label="Close">✕</button><span class="tag">${L(f.tag)}</span><h3>${f.name}</h3><p>${L(f.mgr)} · ${veh(f)}</p></div>
  <div class="d-body">
    <h4>${t("overview")}</h4><p>${L(f.strategy)}</p>
    <h4>${t("facts")}</h4>
    <div class="facts">
      <div><span>${t("inception")}</span><b>${ym(f.inception)}</b></div><div><span>${t("aum")}</span><b>${money(f.aum)}</b></div>
      <div><span>${t("vehicle")}</span><b>${veh(f)}</b></div><div><span>${t("dealing")}</span><b>${liqTxt(f)}</b></div>
    </div>
    <h4>${t("maxdd")}</h4><p>${ddText(f)}</p>
    <h4>${t("liqTerms")}</h4><p>${f.liqFull?L(f.liqFull):t("dailyFull")}</p>
    <h4>${t("perfTitle")}</h4>
    <table class="perf"><tr><th>${t("period")}</th><th>${t("ret")}</th></tr>${[...(f.hist||[]),...f.perf].map(p=>`<tr><td>${perLabel(p)}</td><td class="${p[1]>=0?"pos":"neg"}">${fmt(p[1])}</td></tr>`).join("")}</table>
    <p class="note">${f.note?L(f.note)+" ":""}${t("past")}</p>
  </div>`;
  drawer.classList.add("on");scrim.classList.add("on");drawer.setAttribute("aria-hidden","false");drawer.scrollTop=keep;
}
function closeD(){openFund=null;drawer.classList.remove("on");scrim.classList.remove("on");drawer.setAttribute("aria-hidden","true")}
scrim.onclick=closeD;

/* nav: highlight the link for the section currently in view */
const navLinks=[...document.querySelectorAll(".links a[data-sec]")];
function spy(){
  const line=innerHeight*0.4;
  let cur="about";
  for(const a of navLinks){const el=document.getElementById(a.dataset.sec); if(el&&el.getBoundingClientRect().top<=line) cur=a.dataset.sec}
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4) cur="contact";
  navLinks.forEach(a=>a.classList.toggle("on",a.dataset.sec===cur));
}
addEventListener("scroll",spy,{passive:true}); addEventListener("resize",spy);
navLinks.forEach(a=>a.addEventListener("click",e=>{
  e.preventDefault();
  const el=document.getElementById(a.dataset.sec);
  const y=a.dataset.sec==="about"?0:el.getBoundingClientRect().top+scrollY+(a.dataset.sec==="funds"?10:0);   // lands "Featured Strategies" just below the nav
  window.scrollTo({top:Math.min(y,document.documentElement.scrollHeight-innerHeight),behavior:"smooth"});
}));
document.querySelector(".logo").addEventListener("click",e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})});

/* nav + reveal */
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("solid",scrollY>40));
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.15});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

applyLang();
spy();
</script>
</body>
