/* ---------- cover and scrolling ----------
   The cover builds itself on load (CSS): the curves draw in, the eyebrow line extends, the headline is wiped in from
   below, then the text and the three figures follow, and the figures count up. While scrolling, the cover drifts
   away at its own pace: its text sinks and fades, and the curves rise and turn a little. Further down, the fund
   cards rise one after another the first time they come into view. All of it is skipped for reduced motion. */
const heroEl=document.querySelector(".hero");
function heroScroll(){
  if(calmMotion.matches||scrollY>heroEl.offsetHeight+200&&heroEl.style.getPropertyValue("--p")==="1.0000") return;   // nothing to do once the cover is out of sight
  heroEl.style.setProperty("--p",Math.min(1,scrollY/Math.max(1,heroEl.offsetHeight)).toFixed(4));   // 0 at the top, 1 once the cover has left
}
addEventListener("scroll",heroScroll,{passive:true});
heroScroll();                                                 // a page reloaded part-way down starts in the right place

/** The three cover figures count up from zero ("130+" keeps its "+"). */
function countStats(){
  if(calmMotion.matches) return;
  const items=statEls.filter(b=>!b.isContentEditable).map(b=>{const m=b.textContent.trim().match(/^(\d[\d,]*)(.*)$/);return m?{b,n:+m[1].replace(/,/g,""),tail:m[2]}:null}).filter(Boolean);
  if(!items.length) return;
  const start=performance.now()+1150, length=1500;
  let done=false;
  const finish=()=>{if(done)return;done=true;renderStats()};   // puts back the exact text, including an admin's edit loaded meanwhile
  items.forEach(x=>x.b.textContent="0"+x.tail);
  (function step(now){
    if(done) return;
    const k=Math.min(1,Math.max(0,(now-start)/length)), eased=1-Math.pow(1-k,3);
    items.forEach(x=>x.b.textContent=Math.round(x.n*eased)+x.tail);
    if(k<1) requestAnimationFrame(step); else finish();
  })(performance.now());
  setTimeout(finish,5000);                                    // a tab opened in the background never runs the frames
}
addEventListener("load",()=>setTimeout(countStats,150));

/* the fund cards rise in one after another the first time the row is scrolled into view */
const rowSeen=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  rowSeen.disconnect();
  scroller.classList.add("seen");
  if(calmMotion.matches) return;
  track.classList.add("enter");
  setTimeout(()=>track.classList.remove("enter"),1700);
}),{threshold:.08});
rowSeen.observe(scroller);

applyLang();
spy();

<script>
/* ===== js/account.js ===== */
/* ---------- Login screen + account button in the top bar ----------
   Depends on: CONFIG (config.js), Auth (auth.js), and t / lang / applyLang / closeD from app.js. */
const loginBox = document.getElementById("login"), loginForm = document.getElementById("loginForm");
const loginErr = document.getElementById("loginErr"), loginCancel = document.getElementById("loginCancel");
const acctBtn = document.getElementById("acctBtn"), addFundBtn = document.getElementById("addFundBtn");

/* The login screen fades in with its form rising a little, and fades out the same way. (The class "in" carries the
   visible state; `hidden` is only set once the fade-out has finished.) */
const stillMotion = matchMedia("(prefers-reduced-motion: reduce)");
let loginTimer = 0;
function showLogin(show) {
  clearTimeout(loginTimer);
  document.body.classList.toggle("modal-open", show || !document.getElementById("fundModal").hidden);
  loginCancel.hidden = CONFIG.REQUIRE_LOGIN;                 // a required login cannot be dismissed
  if (show) {
    loginErr.hidden = true; loginForm.reset();
    loginBox.hidden = false;
    void loginBox.offsetWidth;                               // let the browser register the starting state before the fade
    loginBox.classList.add("in");
    setTimeout(() => document.getElementById("loginUser").focus(), 50);
  } else {
    loginBox.classList.remove("in");
    if (stillMotion.matches || loginBox.hidden) loginBox.hidden = true;
    else loginTimer = setTimeout(() => { loginBox.hidden = true; }, 320);
  }
}

/* After signing in or out the page is redrawn (admin tools appear or disappear). `fadeFirst` fades the cards, tabs and
   top-bar buttons out before the redraw; either way they then fade and rise back in. */
let authTimer = 0;
function redrawForAccount(fadeFirst) {
  const redraw = () => { refreshAccount(); applyLang(); };
  clearTimeout(authTimer);
  document.body.classList.remove("auth-out", "auth-in");
  if (stillMotion.matches) return redraw();
  const comeIn = () => {
    redraw();
    document.body.classList.remove("auth-out");
    document.body.classList.add("auth-in");
    authTimer = setTimeout(() => document.body.classList.remove("auth-in"), 750);
  };
  if (!fadeFirst) return comeIn();
  document.body.classList.add("auth-out");
  authTimer = setTimeout(comeIn, 220);
}

/** Updates everything that depends on who is signed in. Called after login, logout and language changes. */
function refreshAccount() {
  const u = Auth.user();
  acctBtn.textContent = u ? `${u.name} · ${t("logout")}` : t("loginBtn");
  addFundBtn.hidden = !Auth.isAdmin();
  if (CONFIG.REQUIRE_LOGIN && !u) showLogin(true);
}

loginForm.addEventListener("submit", e => {
  e.preventDefault();
  const ok = Auth.login(document.getElementById("loginUser").value, document.getElementById("loginPass").value);
  if (!ok) { loginErr.textContent = t("loginErr"); loginErr.hidden = false; return; }
  redrawForAccount(false);                                   // redraw behind the login screen so admin-only controls appear,
  showLogin(false);                                          // then let the screen fade away over the page coming in
});
loginCancel.onclick = () => showLogin(false);

acctBtn.onclick = () => {
  if (!Auth.user()) { showLogin(true); return; }
  Auth.logout();
  closeD();
  document.getElementById("drawer").innerHTML = "";          // drop the last opened fund so an admin's view never lingers in the page
  redrawForAccount(true);
};

// language links on the login screen (the top-bar menu is covered while it is open)
document.querySelectorAll(".login-lang button").forEach(b => b.onclick = () => {
  setLanguage(b.dataset.lang);
});

// app.js calls this at the end of every applyLang()
window.onLangChange = () => {
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
  document.querySelectorAll(".login-lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  refreshAccount();
};
window.onLangChange();
</script>
<script>
/* ===== js/pptx-reader.js ===== */
/* ---------- PPTX reader ----------
   Reads a fund screening deck (.pptx) in the browser, with no server and no library.
   Expected layout, as in the "基金筛选汇报" decks: each slide has ONE comparison table,
   one fund per column, and rows labelled 成立日期 / 基金规模 / 基金策略 / 表现 / 回撤·损失率 / 流动性.
   The first row of the table holds each fund's strategy label.

   PptxReader.read(file) resolves to an array of plain "draft" objects (raw, unescaped text).
   js/add-fund.js turns the drafts the admin accepts into fund cards. */
const PptxReader = (() => {

  /* ---- 1. unzip: a .pptx is a zip file; pull out the slide XML ---- */
  async function inflate(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function slideXml(buf) {
    const v = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder("utf-8");
    let end = -1;                                              // "end of central directory" record, searched from the back
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) {
      if (v.getUint32(i, true) === 0x06054b50) { end = i; break; }
    }
    if (end < 0) throw new Error("not a zip file");
    const count = v.getUint16(end + 10, true);
    let p = v.getUint32(end + 16, true);
    const slides = [];
    for (let n = 0; n < count; n++) {
      if (v.getUint32(p, true) !== 0x02014b50) throw new Error("bad zip directory");
      const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true);
      const nameLen = v.getUint16(p + 28, true), extraLen = v.getUint16(p + 30, true), commentLen = v.getUint16(p + 32, true);
      const local = v.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      const m = name.match(/^ppt\/slides\/slide(\d+)\.xml$/);
      if (m) {
        const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
        const data = u8.subarray(start, start + size);
        const raw = method === 0 ? data : method === 8 ? await inflate(data) : null;
        if (raw) slides.push({ no: +m[1], xml: dec.decode(raw) });
      }
      p += 46 + nameLen + extraLen + commentLen;
    }
    return slides.sort((a, b) => a.no - b.no);
  }

  /* ---- 2. slide XML -> table rows and text boxes ---- */
  const kids = (el, tag) => [...el.getElementsByTagNameNS("*", tag)];
  // one entry per visible line: paragraphs, and manual line breaks (<a:br>) inside a paragraph
  const paraLines = el => kids(el, "p")
    .flatMap(p => kids(p, "*")
      .map(n => n.localName === "t" ? n.textContent : n.localName === "br" ? "\n" : "")
      .join("").split("\n"))
    .map(s => s.replace(/\s+/g, " ").trim())
    .filter(Boolean);

  function parseSlide(xml) {
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const tbl = kids(doc, "tbl")[0];
    const rows = tbl ? kids(tbl, "tr").map(tr => kids(tr, "tc").map(paraLines)) : [];
    const texts = kids(doc, "sp").map(sp => paraLines(sp).join(" ")).filter(Boolean);
    return { rows, texts };
  }

  /* ---- 3. text -> numbers ---- */
  const num = s => Number(String(s).replace("−", "-"));

  /** "$1.5bn", "US$9.61bn", "NAV $3,211M" -> size in US$ bn, or null when no dollar figure is found. */
  function parseMoney(s) {
    const m = s.match(/(?:US)?\$\s*([\d,]+(?:\.\d+)?)\s*(bn|billion|b|mn|million|m)\b/i);
    if (!m) return null;
    const v = parseFloat(m[1].replace(/,/g, ""));
    return /^b/i.test(m[2]) ? v : v / 1000;
  }

  /** Pulls yearly returns out of the performance cell. Everything it cannot read as a yearly return is kept as a note.
      Understands   "2023: +25.04%"   "2022 (6月起): +15.62%"   "2026 YTD (至10月): +4.78%"
      and inline    "净回报: 2023 +11.2%、2024 +10.7%、2025 +8.0%、Q1'26 +1.5%"                                   */
  function parsePerf(lines) {
    const byYear = new Map(), notes = [];
    let target = null;
    const add = (y, v, kind, month) => { if (isFinite(v)) byYear.set(y + (kind || ""), kind ? [y, v, kind, month] : [y, v]); };
    for (const line of lines) {
      const tm = line.match(/目标[^0-9%]{0,14}?(\d+(?:\.\d+)?\s*[-–~]\s*\d+(?:\.\d+)?\s*%|\d+(?:\.\d+)?\s*%)/);
      if (tm && !target) target = tm[1].replace(/\s/g, "");

      const one = line.match(/^((?:19|20)\d{2})\s*(?:\(\s*(\d{1,2})\s*月起\s*\)|YTD\s*\(\s*至\s*(\d{1,2})\s*月\s*\))?\s*[:：]\s*(.+)$/);
      if (one) {
        const v = one[4].trim().match(/^([+\-−]?\d+(?:\.\d+)?)\s*%$/);
        if (v) { add(one[1], num(v[1]), one[2] ? "p" : one[3] ? "ytd" : "", +(one[2] || one[3]) || undefined); continue; }
        if (/^(?:[—–\-]+|NA|N\/A)$/i.test(one[4].trim())) continue;          // "2019: —" means no data that year
      }
      const inline = [...line.matchAll(/((?:19|20)\d{2})\s*([+\-−]\d+(?:\.\d+)?)\s*%/g)];
      if (inline.length >= 2) {
        inline.forEach(x => add(x[1], num(x[2])));
        const q = line.match(/Q([1-4])\s*[‘’'′`]\s*(\d{2})\s*([+\-−]\d+(?:\.\d+)?)\s*%/);   // "Q1'26 +1.5%" = year to date through March 2026
        if (q) add("20" + q[2], num(q[3]), "ytd", q[1] * 3);
        continue;
      }
      notes.push(line);
    }
    const all = [...byYear.values()].sort((a, b) => a[0] - b[0] || (a[2] === "ytd") - (b[2] === "ytd"));
    return { all, notes, target };
  }

  /* ---- 4. one table -> one draft per column ---- */
  const ROWS = [                                    // which table row feeds which field (matched on the first column)
    ["inception", /成立|Inception/i],
    ["aum",       /规模|規模|AUM|Size/i],
    ["strategy",  /策略|Strategy/i],
    ["perf",      /表现|表現|业绩|業績|回报|回報|Performance|Return/i],
    ["dd",        /回撤|损失|損失|Drawdown|Loss/i],
    ["liq",       /流动性|流動性|赎回|贖回|Liquidity|Redemption/i]
  ];

  function draftsFromSlide(slide) {
    const { rows, texts } = parseSlide(slide.xml);
    if (rows.length < 2 || rows[0].length < 2) return [];
    const field = {};
    rows.slice(1).forEach(r => {
      const label = (r[0] || []).join(" ");
      const hit = ROWS.find(([key, re]) => !field[key] && re.test(label));
      if (hit) field[hit[0]] = { label, cells: r.slice(1) };
    });
    if (!field.strategy && !field.perf) return [];                // not a fund comparison table

    const title = texts[0] || "";
    const source = texts.find(x => /^(来源|來源|Source)/i.test(x)) || "";
    // fund names are not in the table; the source line usually lists one "<name> deck" per column, in order
    const names = [...source.matchAll(/(?:^(?:来源|來源|Source)\s*[:：]\s*|[；;]\s*)([A-Za-z][\w&.\- ]*?)\s+deck\b/gi)].map(m => m[1].trim());
    const cols = rows[0].length - 1;
    const cell = (key, c) => (field[key] && field[key].cells[c]) || [];

    return Array.from({ length: cols }, (_, c) => {
      const inc = cell("inception", c), aumLines = cell("aum", c), liq = cell("liq", c), dd = cell("dd", c);
      const perf = parsePerf(cell("perf", c));
      const incText = inc.join(" ");
      const im = incText.match(/^\s*((?:19|20)\d{2})\s*[\/\-.年]\s*(\d{1,2})/);
      const liqText = liq.join(" ");
      const first = liqText.split(/[；;，,。]/)[0].trim();
      // header cell: first line = fund name, remaining lines = strategy label. With a single line, it is the label
      // and the name falls back to the source line.
      const head = rows[0][c + 1] || [];
      const name = head.length > 1 ? head[0] : names.length === cols ? names[c] : "";
      const words = name.split(" ");
      return {
        slide: slide.no, slideTitle: title,
        tag: (head.length > 1 ? head.slice(1) : head).join(" ") || `Fund ${c + 1}`,
        name, mgr: /^group$/i.test(words[1] || "") ? words.slice(0, 2).join(" ") : words[0] || "",
        vehicle: /UCITS/i.test(title) ? "UCITS" : "private",
        liquid: /^(每日|Daily)/i.test(liqText),                   // daily dealing goes to the Liquid tab by default
        inception: im ? `${im[1]}-${String(im[2]).padStart(2, "0")}` : null,
        inceptionLines: inc, isNew: /新发|新發|new fund/i.test(incText),
        aum: parseMoney(aumLines.join(" ")), aumText: aumLines.join(" "),
        strategyLines: cell("strategy", c),
        perf: perf.all, perfNotes: perf.notes, target: perf.target,
        ddLabel: field.dd ? field.dd.label : "", ddLines: dd.filter(x => !/^(NA|N\/A|—|-)$/i.test(x)),
        liqShort: first.length > 26 ? first.slice(0, 25) + "…" : first, liqLines: liq,
        source
      };
    });
  }

  return {
    /** Reads a File chosen by the user. Rejects if it is not a .pptx; resolves to [] if no fund table is found. */
    async read(file) {
      const slides = await slideXml(await file.arrayBuffer());
      if (!slides.length) throw new Error("no slides");
      return slides.flatMap(draftsFromSlide);
    }
  };
})();
</script>
<script>
/* ===== js/add-fund.js ===== */
/* ---------- "Add Funds" from a PPTX deck (admin only) ----------
   Step 1: the admin chooses a .pptx screening deck.  js/pptx-reader.js turns it into drafts, one per table column.
   Step 2: the admin checks each draft (name, manager, tab) and adds the ones they want.
   Depends on: Auth, FundStore, PptxReader, and t / applyLang / closeD from app.js. */
const fundModal = document.getElementById("fundModal"), fundForm = document.getElementById("fundForm");
const fundErr = document.getElementById("fundErr"), fundFile = document.getElementById("fundFile");
const imStatus = document.getElementById("imStatus"), imList = document.getElementById("imList"), imSubmit = document.getElementById("imSubmit");
let drafts = [];

const imStratRow = document.getElementById("imStratRow"), imStratName = document.getElementById("imStratName");
// esc() comes from app.js
const escLines = a => (a || []).map(esc).filter(Boolean).join("<br>");

function showFundModal(show) {
  setModal(fundModal, show);
  document.body.classList.toggle("modal-open", show);
  if (show) { resetImport(); refreshTokenBox(); fundModal.scrollTop = 0; }
}
function resetImport() {
  drafts = []; fundForm.reset();
  imList.innerHTML = ""; imStatus.textContent = ""; fundErr.hidden = true; imSubmit.hidden = true; imStratRow.hidden = true;
}

/** <option> list of every strategy tab, with one selected. */
const stratOptions = selected => FundStore.strategies()
  .map(s => `<option value="${s.id}"${s.id === selected ? " selected" : ""}>${stratLabel(s)}</option>`).join("");

// "create a new strategy for these funds": makes the tab, then points every listed fund at it
document.getElementById("imStratCreate").onclick = () => {
  const s = createStrategy(imStratName.value);
  if (!s) return;
  imStratName.value = "";
  imList.querySelectorAll(".im-tab").forEach(sel => { sel.innerHTML = stratOptions(s.id); });
  renderTabs();
};
imStratName.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("imStratCreate").click(); } });
addFundBtn.onclick = () => { if (Auth.isAdmin()) showFundModal(true); };
document.getElementById("fundCancel").onclick = () => showFundModal(false);
document.getElementById("fundClose").onclick = () => showFundModal(false);
fundModal.addEventListener("mousedown", e => { if (e.target === fundModal) showFundModal(false); });
addEventListener("keydown", e => { if (e.key === "Escape" && !fundModal.hidden) showFundModal(false); });

const fail = msg => { fundErr.textContent = msg; fundErr.hidden = false; };

/** Reads the chosen deck and shows what was found. Also callable directly with a File (used in testing). */
async function importDeck(file) {
  imList.innerHTML = ""; fundErr.hidden = true; imSubmit.hidden = true; drafts = [];
  if (!file) return;
  imStatus.textContent = t("imReading");
  try {
    drafts = await PptxReader.read(file);
  } catch (e) {
    imStatus.textContent = "";
    return fail(t("imBad"));
  }
  if (!drafts.length) { imStatus.textContent = ""; return fail(t("imNone")); }
  imStatus.textContent = t("imFound")(drafts.length, file.name);
  renderDrafts();
  imSubmit.hidden = false; imStratRow.hidden = false;
}
fundFile.addEventListener("change", () => importDeck(fundFile.files[0]));

/* drag and drop: a deck can be dropped anywhere on the Add Fund window */
const dropZone = document.getElementById("dropZone");
let dragDepth = 0;                                           // dragenter/dragleave fire for every child element, so count them
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
/* A picture being dragged is a table (monthly returns or share classes) for one fund in the list, not a deck: it lights up that fund's
   picture box instead of the deck zone. (The file's type is readable while dragging; its name is not.) */
const isPicture = file => !!file && (/^image\//.test(file.type) || /\.(png|jpe?g|webp|gif)$/i.test(file.name || ""));
const draggingPicture = e => [...(e.dataTransfer.items || [])].some(i => i.kind === "file" && /^image\//.test(i.type));
const pictureFrom = list => [...(list || [])].find(isPicture);             // from a drop or from the clipboard
function lightDrop(el) {                                     // highlights one picture box (or none)
  document.querySelectorAll(".mo-drop.drag").forEach(z => { if (z !== el) z.classList.remove("drag"); });
  if (el) el.classList.add("drag");
}
const draftItemAt = target => target.closest(".im-item") || (imList.children.length === 1 ? imList.firstElementChild : null);
fundModal.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; if (!draggingPicture(e)) dropZone.classList.add("drag"); });
fundModal.addEventListener("dragover", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  if (draggingPicture(e)) { const item = draftItemAt(e.target); lightDrop(item && item.querySelector(".mo-drop")); }
});
fundModal.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; dropZone.classList.remove("drag"); lightDrop(null); } });
fundModal.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();                                        // otherwise the browser would open or download the file
  dragDepth = 0; dropZone.classList.remove("drag"); lightDrop(null);
  const file = e.dataTransfer.files[0];
  if (isPicture(file)) {                                     // a picture of a table, for the fund it was dropped on
    const item = draftItemAt(e.target);
    return item ? loadDraftPicture(item, file) : fail(t(imList.children.length ? "moDropWhere" : "imBad"));
  }
  fundFile.value = "";                                       // the picker no longer matches what is loaded
  if (file && !/\.pptx$/i.test(file.name)) { imList.innerHTML = ""; imStatus.textContent = ""; imSubmit.hidden = true; drafts = []; return fail(t("imBad")); }
  importDeck(file);
});

/* ---------- tables from a picture ----------
   The admin gives a fund a picture of a monthly-returns table or of a share-class table (fees and liquidity terms per
   class). The local server has Claude read it and say which of the two it is. Only the table is kept: the picture
   itself is never saved or uploaded anywhere else. */
let monthlyBusy = 0;                                         // pictures still being read; the forms wait for them
const MONTHLY_ACCEPT = "image/png,image/jpeg,image/webp,image/gif";
/** Resolves to { kind: "monthly", rows } or { kind: "classes", table }, or null when the picture could not be read. */
async function readFundPicture(file, statusEl) {
  statusEl.className = "mo-status"; statusEl.textContent = t("moReading");
  monthlyBusy++;
  try {
    const found = await Local.parsePicture(file);
    if (found.kind === "classes") {
      found.table = { head: found.table.head.map(c => esc(c)), rows: found.table.rows.map(r => r.map(c => esc(c))) };
      statusEl.textContent = t("clDone")(found.table.rows.length);
      statusEl.classList.add("ok");
      return found;
    }
    const rows = found.rows, bad = monthlySuspects(rows);
    statusEl.textContent = t("moDone")(rows.length, rows[0].y, rows.at(-1).y) + (bad.length ? " " + t("moCheck")(bad.join(", ")) : "");
    statusEl.classList.add(bad.length ? "warn" : "ok");
    return found;
  } catch (e) {
    statusEl.textContent = UI[lang]["moErr_" + e.message] || t("moErr_api");
    statusEl.classList.add("err");
    return null;
  } finally { monthlyBusy--; }
}
/* The table is edited as text, one year per line (the same idea as "Returns by period" in Edit):
     2020    0.84   -0.37  -21.80   ...   -12.9
   year, twelve months (Jan first), then the year total; "-" stands for an empty cell. Rows pasted from Excel work too. */
const moCellText = (v, d) => v == null ? "-" : v.toFixed(Math.max(d, (String(v).split(".")[1] || "").length));
function monthlyText(rows) {
  if (!rows || !rows.length) return "";
  const line = cells => cells.map((c, i) => i ? String(c).padStart(6) : String(c).padEnd(4)).join(" ");   // always a space between figures
  return [line(["Year", ...MON, "Total"]), ...rows.map(r => line([r.y, ...r.m.map(v => moCellText(v, 2)), moCellText(r.t, 1)]))].join("\n");
}
/** Text -> { rows } (empty list for no table), or { bad: "2020" } naming the first line that cannot be read. */
function parseMonthlyText(text) {
  const rows = {};
  for (const raw of String(text).split(/\n/)) {
    const line = raw.replace(/\s+$/, "");
    if (!/^\s*\d/.test(line)) continue;                       // blank lines and the "Year Jan Feb ..." heading
    const head = line.match(/^\s*(\d+) *[:：]?(?: *[,;，；\t]| +|$)(.*)$/), bad = { bad: line.trim().split(/[\s,;:：]/)[0].slice(0, 12) };
    if (!head) return bad;
    const year = head[1], rest = head[2];                     // the year, then the cells: tab, comma or space separated
    const cells = (rest.includes("\t") ? rest.split("\t") : /[,;，；]/.test(rest) ? rest.split(/[,;，；]/) : rest.trim().split(/\s+/)).map(c => c.trim());
    if (!/^(19|20)\d{2}$/.test(year) || rows[year] || cells.length < 12 || cells.length > 13) return bad;
    const nums = [];
    for (const c of cells) {
      const neg = /^\(.*\)$/.test(c), s = c.replace(/[()%\s]/g, "").replace(/[−–]/g, "-");
      if (s === "" || s === "-" || s === "—" || /^n\/?a$/i.test(s)) { nums.push(null); continue; }
      if (!/^[+-]?(\d+(\.\d+)?|\.\d+)$/.test(s)) return bad;
      nums.push(neg ? -Math.abs(+s) : +s);
    }
    if (nums.some(v => v != null)) rows[year] = { y: year, m: nums.slice(0, 12), t: nums.length > 12 ? nums[12] : null };
  }
  return { rows: Object.keys(rows).sort().map(y => rows[y]) };
}
/** Shows what the text holds (or the line that is wrong) under the box, and returns the parse result. */
function checkMonthlyText(text, statusEl) {
  const p = parseMonthlyText(text);
  statusEl.className = "mo-status";
  if (p.bad != null) { statusEl.textContent = t("moErrLine")(p.bad); statusEl.classList.add("err"); return p; }
  const suspect = monthlySuspects(p.rows);
  statusEl.textContent = p.rows.length ? t("moRows")(p.rows.length, p.rows[0].y, p.rows.at(-1).y) + (suspect.length ? " " + t("moCheck")(suspect.join(", ")) : "") : t("moNone");
  if (suspect.length) statusEl.classList.add("warn");
  return p;
}

/* The share-class table is edited as text too: the column titles on the first line, then one class per line, with
   " | " between the cells:
     Class    | Management Fee | Lock-Up
     Class CS | 1.50%          | 1 Year Hard
   Rows pasted from Excel (tab separated) work too. Stored as { head: [titles], rows: [[cells]] }, cells as escaped text. */
function classesText(table) {
  if (!table || !table.rows || !table.rows.length) return "";
  const grid = [table.head, ...table.rows].map(r => r.map(c => plain(c)));
  const width = table.head.map((_, i) => Math.max(...grid.map(r => (r[i] || "").length)));
  return grid.map(r => r.map((c, i) => i < r.length - 1 ? c.padEnd(width[i]) : c).join(" | ")).join("\n");
}
/** Text -> { table } (null for no table), or { bad: "Series M" } naming the first line that cannot be read. */
function parseClassesText(text) {
  const lines = String(text).split(/\n/).filter(l => l.trim());
  if (!lines.length) return { table: null };
  const cellsOf = l => (l.includes("\t") ? l.split("\t") : l.split(/[|｜]/)).map(c => esc(c.slice(0, 120)));
  const name = l => l.trim().split(/\s*[|｜\t]/)[0].slice(0, 24);
  const head = cellsOf(lines[0]);
  if (head.length < 2 || head.length > 10 || lines.length < 2 || lines.length > 41) return { bad: name(lines[0]) };
  const rows = [];
  for (const l of lines.slice(1)) {
    const cells = cellsOf(l);
    if (cells.length > head.length || !cells[0]) return { bad: name(l) };
    rows.push([...cells, ...Array(head.length - cells.length).fill("")]);
  }
  return { table: { head, rows } };
}
function checkClassesText(text, statusEl) {
  const p = parseClassesText(text);
  statusEl.className = "mo-status";
  if (p.bad != null) { statusEl.textContent = t("clErrLine")(p.bad); statusEl.classList.add("err"); }
  else statusEl.textContent = p.table ? t("clRows")(p.table.rows.length, p.table.head.length) : t("clNone");
  return p;
}

/* the picture box: click to choose, drop a picture on it, or paste a screenshot */
const moDropHTML = inputAttrs => `<label class="mo-drop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 3.5 3 3-2.5 4.5 4"/></svg><div><b>${t("moDrop")}</b><small>${t("moDropHint")}</small></div><input ${inputAttrs} type="file" accept="${MONTHLY_ACCEPT}"></label>`;
imList.addEventListener("change", e => {
  if (e.target.matches(".im-monthly") && e.target.files[0]) loadDraftPicture(e.target.closest(".im-item"), e.target.files[0]);
});
imList.addEventListener("paste", e => {
  const item = e.target.closest(".im-item"), file = pictureFrom(e.clipboardData && e.clipboardData.files);
  if (item && file) { e.preventDefault(); loadDraftPicture(item, file); }
});
async function loadDraftPicture(item, file) {
  fundErr.hidden = true;
  item.querySelector(".im-monthly").value = "";              // the picker no longer matches what was read
  const found = await readFundPicture(file, item.querySelector(".im-mo .mo-status"));
  if (!found || !item.isConnected) return;
  // the table goes into its text box, where the admin can correct anything before adding the fund
  const box = item.querySelector(found.kind === "classes" ? ".im-cledit" : ".im-moedit"), area = box.querySelector("textarea");
  area.value = found.kind === "classes" ? classesText(found.table) : monthlyText(found.rows);
  box.hidden = false;
  area.dispatchEvent(new Event("input", { bubbles: true }));
}
imList.addEventListener("input", e => {
  if (e.target.matches(".im-motext")) checkMonthlyText(e.target.value, e.target.closest(".im-moedit").querySelector(".mo-status"));
  if (e.target.matches(".im-cltext")) checkClassesText(e.target.value, e.target.closest(".im-cledit").querySelector(".mo-status"));
});

/** Suggests the words to hide from investors: the fund and manager names, plus other name-like words
    (sister funds, vintages) found in the deck's track record, loss and inception text. The admin can edit the list. */
function suggestHidden(d) {
  // ordinary words and finance abbreviations that are never a fund or manager name, so "ITD", "ROE" or "Residential"
  // are not hidden; roman numerals and quarter labels are skipped too
  const generic = /^(abf|abl|abs|absolute|alpha|and|annual|annualized|approved|asset|assets|aum|average|aviation|backed|based|beta|biopharma|bond|bonds|bps|capital|cash|class|clo|close|closed|cmbs|commercial|composite|consumer|core|corporate|covid|credit|debt|deck|direct|disease|diseases|distribution|diversified|dividend|dpi|drawdown|duration|dynamic|end|ended|equipment|equity|est|estate|estimated|etf|eur|euribor|evergreen|expected|fico|final|finance|financial|first|fixed|flagship|floating|fully|fund|funds|gbp|global|grade|gross|group|harvesting|healthcare|high|hypothetical|inc|inception|income|institutional|international|invested|investing|investment|investments|irr|issue|itd|launch|launched|legacy|lending|libor|lien|liens|liquid|llc|loan|loans|long|ltd|ltv|management|marketing|master|medical|model|moic|monthly|mortgage|mortgages|msr|msrs|multi|nav|net|new|note|notes|npl|off|one|open|opportunistic|opportunities|opportunity|orphan|partners|performance|platform|plc|portfolio|portfolios|private|privates|product|products|program|programme|proj|projected|public|quarterly|rare|rate|real|realized|record|reit|related|remaining|residential|return|returns|rmbs|roa|roe|royalties|royalty|rpl|run|rvpi|second|secured|securitized|semi|senior|series|sharpe|short|sicav|since|situations|sofr|special|specialty|spv|strategies|strategy|structured|target|targeting|term|the|therapeutic|third|total|track|transportation|tvpi|ucits|usd|value|vintage|year|years|yield|yoy|ytd|[ivx]+[a-c]?|q[1-4])$/i;
  const text = [d.name, d.mgr, ...d.inceptionLines, ...d.perfNotes, ...d.ddLines].join(" ");
  const words = text.match(/\b[A-Z][A-Za-z0-9&]{2,}\b/g) || [];
  return [...new Set(words.filter(w => !generic.test(w)))];
}

function renderDrafts() {
  imList.innerHTML = drafts.map((d, i) => {
    const size = d.aum != null ? money(d.aum) : esc(d.aumText) || "—";
    const inc = d.inception ? ym(d.inception) : d.isNew ? t("newFund") : esc(d.inceptionLines[0]) || "—";
    const returns = d.perf.length
      ? `${t("imReturns")(d.perf.length)}: ${d.perf.map(p => perLabel(p) + " " + fmt(p[1])).join(", ")}`
      : t("imNoReturns");
    return `<div class="im-item" data-n="${i}">
      <input class="im-on" type="checkbox" checked aria-label="${t("imInclude")}">
      <div class="im-main">
        <div class="im-tag">${esc(d.tag)}<small>${t("imSlide")} ${d.slide}${d.slideTitle ? " · " + esc(d.slideTitle) : ""}</small></div>
        <div class="im-fields">
          <label><span>${t("imName")}</span><input class="im-name" maxlength="80" value="${esc(d.name)}"></label>
          <label><span>${t("afMgr")}</span><input class="im-mgr" maxlength="60" value="${esc(d.mgr)}"></label>
          <label><span>${t("afCategory")}</span><select class="im-tab">${stratOptions(d.liquid ? "liquid" : "illiquid")}</select></label>
          <label class="wide"><span>${t("imHide")}</span><input class="im-hide" maxlength="300" data-auto="${esc(suggestHidden(d).join(", "))}" value="${esc(suggestHidden(d).join(", "))}"></label>
        </div>
        <ul class="im-sum">
          <li><b>${t("aum")}:</b> ${size} &nbsp;·&nbsp; <b>${t("inception")}:</b> ${inc}</li>
          <li><b>${t("ret")}:</b> ${returns}</li>
          <li><b>${t("dealing")}:</b> ${esc(d.liqShort) || "—"}</li>
        </ul>
        <div class="im-mo"><span>${t("picTitle")}</span>${moDropHTML('class="im-monthly"')}<small class="mo-status"></small></div>
        <div class="im-moedit" hidden><span class="im-sub">${t("moBoxTitle")}</span><textarea class="im-motext mo-text" rows="8" wrap="off" spellcheck="false" aria-label="${t("moBoxTitle")}"></textarea><small class="mo-status"></small><small>${t("moHelp")}</small></div>
        <div class="im-cledit" hidden><span class="im-sub">${t("clTitle")}</span><textarea class="im-cltext mo-text" rows="6" wrap="off" spellcheck="false" aria-label="${t("clTitle")}"></textarea><small class="mo-status"></small><small>${t("clHelp")}</small></div>
      </div></div>`;
  }).join("");
}

/** Turns an accepted draft into a fund object, in the shape used by js/funds-data.js plus a few free-text fields. */
function fundFromDraft(d, i, name, mgr, hide, hideUntouched) {
  const one = s => ({ en: s });                               // deck text is shown as written, in every language
  const fund = {
    id: `custom-${Date.now()}-${i}`, custom: true,
    name: esc(name), mgr: one(esc(mgr) || "—"), tag: one(esc(d.tag)),
    vehicle: d.vehicle,
    inception: d.inception, inceptionText: escLines(d.inceptionLines), isNew: d.isNew,
    aum: d.aum, aumText: esc(d.aumText),
    strategy: one(escLines(d.strategyLines)),
    hist: d.perf.slice(0, -15),                               // the card shows the latest 15 periods; older years appear in View Fund only
    perf: d.perf.slice(-15),
    perfNotes: d.perfNotes.map(esc), target: d.target ? esc(d.target) : null,
    ddLabel: esc(d.ddLabel), ddRaw: escLines(d.ddLines),
    liq: one(esc(d.liqShort) || "—"), liqFull: one(escLines(d.liqLines))
  };
  if (d.source) fund.note = one(esc(d.source));
  if (d.classes) fund.classes = d.classes;                  // share classes: fees and liquidity terms per class
  if (d.monthly && d.monthly.length) fund.monthly = d.monthly;   // numbers read from the monthly-returns picture, as corrected by the admin
  // words masked in the investor view (see R() in app.js); longest first so "HCRx" is matched before "HCR"
  fund.redact = [...new Set(String(hide).split(/[,，、;；]/).map(w => esc(w)).filter(w => w.length > 1))]
    .sort((x, y) => y.length - x.length)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  // true = the list above is only the site's rule-based guess, so Claude's choice replaces it when the fund is translated;
  // false = the admin edited the list, so their words are kept and Claude's are added
  fund.redactAuto = !!hideUntouched;
  return fund;
}

fundForm.addEventListener("submit", e => {
  e.preventDefault();
  if (!Auth.isAdmin()) return fail(t("errAdmin"));
  if (!Repo.hasToken() && !Local.on) return fail(t("ghNeedTokenHere"));   // nothing can be saved for everyone without it
  if (monthlyBusy) return fail(t("moWait"));
  const picked = [...imList.querySelectorAll(".im-item")].filter(el => el.querySelector(".im-on").checked);
  if (!picked.length || picked.some(el => !el.querySelector(".im-name").value.trim())) return fail(t("imNoneSel"));

  for (const el of picked) {                                   // the monthly tables as they stand in the text boxes
    const p = parseMonthlyText(el.querySelector(".im-motext").value);
    if (p.bad != null) return fail(t("moErrLine")(p.bad));
    drafts[+el.dataset.n].monthly = p.rows;
    const c = parseClassesText(el.querySelector(".im-cltext").value);
    if (c.bad != null) return fail(t("clErrLine")(c.bad));
    drafts[+el.dataset.n].classes = c.table;
  }

  let saved = true, lastTab = "";
  const added = [];
  picked.forEach(el => {
    const i = +el.dataset.n;
    lastTab = el.querySelector(".im-tab").value;
    const fund = fundFromDraft(drafts[i], i, el.querySelector(".im-name").value, el.querySelector(".im-mgr").value, el.querySelector(".im-hide").value,
      el.querySelector(".im-hide").value.trim() === el.querySelector(".im-hide").dataset.auto.trim());
    saved = FundStore.add(lastTab, fund) && saved;
    added.push(fund.id);
  });
  showFundModal(false);
  added.forEach(id => markJustAdded(id));                                           // the new cards carry a gold outline that fades away
  selectTab(lastTab);                                                               // show the strategy the funds went to
  applyLang();
  const sc = document.getElementById("scroller");
  sc.scrollTo({ left: sc.scrollWidth, behavior: "smooth" });                        // new funds are added at the end

  if (!saved) alert(t("errStorage"));
  // Saving and translating happen in js/repo.js: FundStore reports the change, the file is committed to GitHub,
  // and the "Translate funds" workflow fills in the other two languages.
});

/** Called from the Delete button inside an added fund's detail panel. */
function deleteFund(id) {
  if (needToken()) return;
  if (!Auth.isAdmin() || !confirm(t(String(id).startsWith("b-") ? "confirmDeleteBuiltIn" : "confirmDelete"))) return;
  FundStore.remove(id);
  closeD();
  applyLang();
}
</script>
<script>
/* ===== js/edit-fund.js ===== */
/* ---------- Edit and delete a fund (admin only) ----------
   Every card has Edit and Delete buttons for admins; View Fund has the same two buttons at the bottom.
   Depends on: Auth, FundStore, escLines (add-fund.js), and esc / t / L / lang / veh / ddText / selectTab / applyLang / closeD from app.js. */
const editModal = document.getElementById("editModal"), editForm = document.getElementById("editForm"), editErr = document.getElementById("editErr");
const ef = id => document.getElementById(id);
let editing = null;                                          // { fund, strat, ddShown } while the form is open

/* stored text is HTML (escaped, with <br> between lines); turn it back into what a person would type */
const plain = html => { const box = document.createElement("textarea"); box.innerHTML = String(html || "").replace(/<br\s*\/?>/gi, "\n"); return box.value; };
const lines = text => String(text).split(/\n/).map(s => s.trim()).filter(Boolean);

/* yearly returns as editable lines:   2023: 25.04   |   2022 from 6: 15.62   |   2026 YTD 10: 4.78 */
const returnLine = p => `${p[0]}${p[2] === "p" ? ` from ${p[3]}` : p[2] === "ytd" ? ` YTD ${p[3]}` : ""}: ${p[1]}`;
function parseReturnLines(text) {
  const rows = [];
  for (const line of lines(text)) {
    const m = line.match(/^(\d{4})\s*(?:(from|ytd)\s*(\d{1,2}))?\s*[:：,]\s*([+\-−]?\d+(?:\.\d+)?)\s*%?$/i);
    if (!m || (m[2] && !(+m[3] >= 1 && +m[3] <= 12))) return null;
    const v = Number(m[4].replace("−", "-"));
    rows.push(m[2] ? [m[1], v, m[2].toLowerCase() === "from" ? "p" : "ytd", +m[3]] : [m[1], v]);
  }
  const keys = rows.map(r => r[0] + (r[2] === "ytd" ? "y" : ""));
  if (new Set(keys).size !== keys.length) return null;       // the same period twice
  return rows.sort((a, b) => a[0] - b[0] || (a[2] === "ytd") - (b[2] === "ytd"));
}

function showEditModal(show) {
  setModal(editModal, show);
  document.body.classList.toggle("modal-open", show);
  if (!show) editing = null;
}

function openEdit(id) {
  const hit = FundStore.find(id);
  if (!hit || !Auth.isAdmin() || needToken()) return;
  closeD();
  const f = hit.fund;
  const ddShown = LX(f.ddRaw) ? plain(LX(f.ddRaw)) : f.dd ? plain(ddText(f)) : "";
  const liqShown = plain(liqTxt(f));                          // funds with daily dealing have no stored text; "Daily" is the default
  editing = { fund: f, strat: hit.strat, ddShown, liqShown };
  editErr.hidden = true;
  ef("efStrat").innerHTML = FundStore.strategies().map(s => `<option value="${s.id}"${s.id === hit.strat ? " selected" : ""}>${stratLabel(s)}</option>`).join("");
  ef("efName").value = plain(f.name);
  ef("efMgr").value = plain(L(f.mgr));
  ef("efTag").value = plain(L(f.tag));
  ef("efVehicle").value = plain(veh(f));
  ef("efInception").value = f.inception || "";
  ef("efInceptionText").value = plain(LX(f.inceptionText));
  ef("efAum").value = f.aum != null ? f.aum : "";
  ef("efAumText").value = plain(LX(f.aumText));
  ef("efTarget").value = plain(LX(f.target));
  ef("efStrategy").value = plain(L(f.strategy));
  ef("efLiq").value = liqShown;
  ef("efLiqFull").value = f.liqFull ? plain(L(f.liqFull)) : "";
  ef("efReturns").value = [...(f.hist || []), ...f.perf].map(returnLine).join("\n");
  ef("efNotes").value = notesOf(f).map(plain).join("\n");
  ef("efDd").value = ddShown;
  ef("efNote").value = f.note ? plain(L(f.note)) : "";
  ef("efHide").defaultValue = ef("efHide").value = (f.redact || []).map(w => plain(w.replace(/\\(.)/g, "$1"))).join(", ");
  // The monthly table is edited as text, one year per line. A picture fills the box; any figure can then be corrected.
  ef("efMonthly").value = "";
  editing.monthlyShown = ef("efMonthlyText").value = monthlyText(f.monthly);
  editing.classesShown = ef("efClassesText").value = classesText(classesOf(f));
  ef("efClassesKeep").checked = !!f.classesKeepText;
  ef("efPicStatus").textContent = "";
  refreshMonthlyField();
  refreshClassesField();
  showEditModal(true);
  editModal.scrollTop = 0;
}

const refreshMonthlyField = () => checkMonthlyText(ef("efMonthlyText").value, ef("efMonthlyStatus"));
const refreshClassesField = () => checkClassesText(ef("efClassesText").value, ef("efClassesStatus"));
/* Claude reads the picture and says whether it is a monthly-returns table or a share-class table; it fills that box. */
async function loadEditPicture(file) {
  const session = editing;
  if (!file || !session) return;
  ef("efMonthly").value = "";
  const found = await readFundPicture(file, ef("efPicStatus"));
  if (!found || editing !== session) return;
  if (found.kind === "classes") { ef("efClassesText").value = classesText(found.table); refreshClassesField(); }
  else { ef("efMonthlyText").value = monthlyText(found.rows); refreshMonthlyField(); }
}
ef("efMonthly").addEventListener("change", () => loadEditPicture(ef("efMonthly").files[0]));
/* a picture can also be dropped anywhere on the Edit window, or pasted from the clipboard (a screenshot) */
editModal.addEventListener("dragover", e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; lightDrop(ef("efMonthlyDrop")); });
editModal.addEventListener("dragleave", e => { if (!editModal.contains(e.relatedTarget)) lightDrop(null); });
editModal.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();                                        // otherwise the browser would open the file
  lightDrop(null);
  ef("efMonthlyDrop").scrollIntoView({ block: "nearest" });  // the result is reported under the box
  loadEditPicture(e.dataTransfer.files[0]);
});
editModal.addEventListener("paste", e => {
  const file = pictureFrom(e.clipboardData && e.clipboardData.files);
  if (file) { e.preventDefault(); ef("efMonthlyDrop").scrollIntoView({ block: "nearest" }); loadEditPicture(file); }
});
ef("efMonthlyText").addEventListener("input", refreshMonthlyField);
ef("efClassesText").addEventListener("input", refreshClassesField);

ef("editCancel").onclick = () => showEditModal(false);
ef("editClose").onclick = () => showEditModal(false);
editModal.addEventListener("mousedown", e => { if (e.target === editModal) showEditModal(false); });
addEventListener("keydown", e => { if (e.key === "Escape" && !editModal.hidden) showEditModal(false); });

editForm.addEventListener("submit", e => {
  e.preventDefault();
  if (!editing || !Auth.isAdmin()) return;
  const fail = (key, arg) => { const msg = t(key); editErr.textContent = typeof msg === "function" ? msg(arg) : msg; editErr.hidden = false; };
  if (monthlyBusy) return fail("moWait");                    // a picture is still being read
  const monthlyChanged = ef("efMonthlyText").value !== editing.monthlyShown, monthly = parseMonthlyText(ef("efMonthlyText").value);
  if (monthlyChanged && monthly.bad != null) return fail("moErrLine", monthly.bad);
  const classesChanged = ef("efClassesText").value !== editing.classesShown, classes = parseClassesText(ef("efClassesText").value);
  if (classesChanged && classes.bad != null) return fail("clErrLine", classes.bad);
  const val = id => ef(id).value.trim();
  if (!val("efName") || !val("efTag")) return fail("efErrRequired");
  const all = parseReturnLines(ef("efReturns").value);
  if (!all) return fail("efErrReturns");
  const aum = val("efAum") === "" ? null : Number(val("efAum"));
  if (aum !== null && !(aum > 0)) return fail("errAum");

  const f = JSON.parse(JSON.stringify(editing.fund));        // work on a copy; nothing changes unless saving succeeds
  // Built-in funds hold separate English / 简体 / 繁體 text: an edit changes the language being viewed.
  // Added funds hold one text, shown in every language.
  const setText = (key, html) => {
    const o = f[key] && typeof f[key] === "object" ? f[key] : {};
    if (Object.keys(o).length > 1) o[lang] = html; else o.en = html;
    f[key] = o;
  };
  // true for a field that holds one text per language (built-in funds, and added funds after translation)
  const perLang = key => f[key] && typeof f[key] === "object" && !Array.isArray(f[key]) && Object.keys(f[key]).length > 1;
  const optional = (key, html, asText) => {
    if (perLang(key)) f[key][lang] = html;                   // only the language being viewed changes
    else if (!html) delete f[key];
    else if (asText) setText(key, html);
    else f[key] = html;
  };

  f.name = esc(val("efName"));
  setText("mgr", esc(val("efMgr")) || "—");
  setText("tag", esc(val("efTag")));
  const vehicle = val("efVehicle");
  f.vehicle = ["en", "sc", "tc"].some(k => UI[k].private.toLowerCase() === vehicle.toLowerCase()) ? "private" : esc(vehicle) || "—";
  f.inception = val("efInception") || null;
  optional("inceptionText", escLines(lines(ef("efInceptionText").value)));
  f.isNew = !f.inception && /新发|新發|new/i.test(val("efInceptionText"));
  f.aum = aum;
  optional("aumText", esc(val("efAumText")));
  if (perLang("target")) f.target[lang] = esc(val("efTarget")); else f.target = esc(val("efTarget")) || null;
  setText("strategy", escLines(lines(ef("efStrategy").value)));
  if (f.liq || val("efLiq") !== editing.liqShown) setText("liq", esc(val("efLiq")) || "—");   // keep the translated default unless it was changed
  optional("liqFull", escLines(lines(ef("efLiqFull").value)), true);
  // The card shows the latest 15 periods; older years appear in View Fund only. A fund with `cardFrom` (a year) keeps
  // everything before that year off the card: those rows are a predecessor or composite record, not the fund's own.
  const own = f.cardFrom ? all.filter(p => p[0] >= f.cardFrom) : all;
  f.perf = own.slice(-15);
  f.hist = all.filter(p => !f.perf.includes(p));
  const noteLines = lines(ef("efNotes").value).map(esc);
  if (perLang("perfNotes")) f.perfNotes[lang] = noteLines; else f.perfNotes = noteLines;
  const dd = ef("efDd").value.trim();
  if (dd !== editing.ddShown.trim()) {                       // only touched when the admin changed it
    if (perLang("ddRaw")) f.ddRaw[lang] = escLines(lines(dd));
    else if (dd) f.ddRaw = escLines(lines(dd));
    else { delete f.ddRaw; delete f.dd; }
  }
  optional("note", escLines(lines(ef("efNote").value)), true);
  if (val("efHide") !== ef("efHide").defaultValue.trim()) f.redactAuto = false;   // the admin changed the list: keep it on later re-translations
  f.redact = [...new Set(val("efHide").split(/[,，、;；]/).map(w => esc(w)).filter(w => w.length > 1))]
    .sort((x, y) => y.length - x.length)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));

  if (monthlyChanged) { if (monthly.rows.length) f.monthly = monthly.rows; else delete f.monthly; }   // untouched text leaves the table as it is

  if (classesChanged) {                                      // a built-in fund can hold one table per language: only the one on screen changes
    if (!classes.table) delete f.classes;
    else if (f.classes && !f.classes.head && Object.keys(f.classes).length > 1) f.classes[lang] = classes.table;
    else f.classes = classes.table;
  }
  if (f.classes && ef("efClassesKeep").checked) f.classesKeepText = true; else delete f.classesKeepText;

  const strat = ef("efStrat").value, id = f.id;
  const saved = FundStore.update(id, f, strat);
  showEditModal(false);
  selectTab(strat);
  applyLang();
  if (!saved) alert(t("errStorage"));
});

/* Edit / Delete buttons on the cards */
document.getElementById("track").addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]"), del = e.target.closest("[data-delfund]");
  if (edit) openEdit(edit.dataset.edit);
  if (del) deleteFund(del.dataset.delfund);
});
</script>
<script>
/* ===== js/repo.js ===== */
/* ---------- Shared data on GitHub ----------
   Admin changes are saved for everyone by committing data/funds.json to the repository through the GitHub API.
   That commit also starts the "Translate funds" workflow (.github/workflows/translate-funds.yml), which fills in
   English / 简体 / 繁體 for new funds using the ANTHROPIC_API_KEY repository secret. The Claude key never reaches
   the browser.

   What the browser does hold is a GitHub token the admin pastes in the Add Fund window. Create it as a
   fine-grained personal access token limited to this one repository with "Contents: Read and write".
   It is kept in this browser's localStorage and sent only to api.github.com.

   Depends on: CONFIG.REPO (config.js), FundStore, Auth, and t / applyLang from app.js. */
const Repo = (() => {
  const TOKEN_KEY = "jc-github-token";
  const R = CONFIG.REPO;
  const API = `https://api.github.com/repos/${R.owner}/${R.name}/contents/${R.path}`;
  const RAW = `https://raw.githubusercontent.com/${R.owner}/${R.name}/${R.branch}/${R.path}`;

  const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } };
  const setToken = k => { try { k ? localStorage.setItem(TOKEN_KEY, k) : localStorage.removeItem(TOKEN_KEY); return true; } catch (e) { return false; } };

  // base64 that is safe for Chinese text
  const encode = str => { let bin = ""; new TextEncoder().encode(str).forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin); };
  const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));

  /** Thrown with a `code` the UI turns into a message: auth, network, conflict, api. */
  class RepoError extends Error { constructor(code, detail) { super(detail || code); this.code = code; } }

  async function call(method, body) {
    let res;
    try {
      res = await fetch(method === "GET" ? `${API}?ref=${R.branch}` : API, {
        method, cache: "no-store",
        headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${getToken()}`, "X-GitHub-Api-Version": "2022-11-28" },
        body: body ? JSON.stringify(body) : undefined
      });
    } catch (e) { throw new RepoError("network", String(e && e.message || e)); }
    if (res.status === 401 || res.status === 403) throw new RepoError("auth", `GitHub answered ${res.status}`);
    if (res.status === 409 || res.status === 422) throw new RepoError("conflict", `GitHub answered ${res.status}`);
    if (res.status === 404 && method === "GET") return null;
    if (!res.ok) throw new RepoError(res.status === 404 ? "auth" : "api", `GitHub answered ${res.status}`);
    return res.json();
  }

  /** Latest shared state straight from the repository (needs the token). Returns { state, sha }. */
  async function readRemote() {
    const file = await call("GET");
    if (!file) return { state: null, sha: null };
    try { return { state: JSON.parse(decode(file.content)), sha: file.sha }; }
    catch (e) { throw new RepoError("api", "data/funds.json is not valid JSON"); }
  }
  /** Shared state as every visitor gets it: the published file, no token needed. */
  async function readPublic() {
    for (const url of [`${R.path}?ts=${Date.now()}`, `${RAW}?ts=${Date.now()}`]) {
      try { const res = await fetch(url, { cache: "no-store" }); if (res.ok) return await res.json(); } catch (e) {}
    }
    return null;
  }

  /* ---- merging, so two sources of change do not overwrite each other ----
     `synced` remembers each added fund as it was when this page last loaded or saved. When saving:
       - a fund this admin has not touched since then takes the repository's version (that is how translations arrive);
       - funds and strategies that appeared in the repository meanwhile (another admin) are kept;
       - everything else follows this admin's page. */
  let synced = new Map(), syncedStrats = new Set();
  const eachFund = (state, fn) => Object.entries(state.funds || {}).forEach(([strat, list]) => (list || []).forEach(f => fn(f, strat)));
  function remember(state) {
    synced = new Map(); syncedStrats = new Set((state.strategies || []).map(s => s.id));
    eachFund(state, f => synced.set(f.id, JSON.stringify(f)));
  }
  function merge(local, remote) {
    const out = JSON.parse(JSON.stringify(local));
    const remoteById = new Map(); eachFund(remote, (f, strat) => remoteById.set(f.id, { f, strat }));
    const localIds = new Set(); eachFund(out, f => localIds.add(f.id));
    Object.keys(out.funds).forEach(strat => {
      out.funds[strat] = out.funds[strat].map(f => (remoteById.has(f.id) && synced.get(f.id) === JSON.stringify(f) ? remoteById.get(f.id).f : f));
    });
    (remote.strategies || []).forEach(s => { if (!out.strategies.some(x => x.id === s.id) && !syncedStrats.has(s.id)) out.strategies.push(s); });
    remoteById.forEach(({ f, strat }, id) => {
      if (localIds.has(id) || synced.has(id)) return;
      if (FundStore.isBuiltIn(strat) || out.strategies.some(s => s.id === strat)) (out.funds[strat] = out.funds[strat] || []).push(f);
    });
    return out;
  }
  const untranslated = state => { let n = 0; eachFund(state, f => { if (!f.translated) n++; }); return n; };

  /** Commits the page's state to data/funds.json. Returns the state that was saved. */
  async function saveNow() {
    for (let attempt = 0; ; attempt++) {
      const remote = await readRemote();
      const merged = remote.state ? merge(FundStore.getState(), remote.state) : FundStore.getState();
      try {
        await call("PUT", {
          message: "Update funds from the site",
          content: encode(JSON.stringify(merged, null, 2) + "\n"),
          branch: R.branch,
          ...(remote.sha ? { sha: remote.sha } : {})
        });
        remember(merged);
        FundStore.setState(merged);
        return merged;
      } catch (e) {
        if (!(e instanceof RepoError) || e.code !== "conflict" || attempt >= 2) throw e;   // someone else saved in between: read again and retry
      }
    }
  }

  return { hasToken: () => !!getToken(), setToken, readRemote, readPublic, saveNow, merge, remember, untranslated, RepoError };
})();

/* ---------- Local server (server.py) ----------
   When the site is opened through `python server.py` on someone's own computer, that server can translate funds
   straight away (it holds the Claude key) and can save data/funds.json on disk. The published site has no such
   server, so there `Local.on` stays false and everything goes through GitHub as described above. */
const Local = {
  on: false, canTranslate: false, reason: "nokey",
  async detect() {
    try {
      const res = await fetch("api/health", { cache: "no-store" });
      const info = res.ok ? await res.json() : null;
      if (info && info.fundPitchLocal) { Local.on = true; Local.canTranslate = !!info.translate; Local.reason = info.reason || "nokey"; }
    } catch (e) {}
  },
  /** Writes the shared data to data/funds.json on this computer. */
  async save(state) {
    const res = await fetch("api/funds", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
    if (!res.ok) throw new Error("local save failed");
  },
  /** Sends a picture of a table to the local server, which has Claude read it. Resolves to
      { kind: "monthly", rows } or { kind: "classes", table: { head, rows } }; rejects with an Error whose message
      is a code (noserver, nokey, notable, big, ...). */
  async parsePicture(file) {
    if (!Local.on) throw new Error("noserver");
    if (!Local.canTranslate) throw new Error(Local.reason);
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error("type");
    if (file.size > 4500000) throw new Error("big");
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error("api"));
      reader.readAsDataURL(file);
    });
    let res, reply;
    try {
      res = await fetch("api/picture", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: String(dataUrl).split(",")[1], mediaType: file.type }) });
      reply = await res.json();
    } catch (e) { throw new Error("network"); }
    const good = reply.kind === "monthly" ? Array.isArray(reply.rows) && reply.rows.length
      : reply.kind === "classes" && reply.table && Array.isArray(reply.table.head) && Array.isArray(reply.table.rows) && reply.table.rows.length;
    if (!res.ok || !good) throw new Error(reply.error || "api");
    return reply;
  },
  /** Translates every fund that is not translated yet. Resolves to { done, failed, code }. */
  async translatePending() {
    const pending = Object.values(FundStore.getState().funds).flat().filter(f => !f.translated);
    if (!pending.length) return { done: 0, failed: 0, code: "" };
    if (!Local.canTranslate) return { done: 0, failed: pending.length, code: Local.reason };
    let done = 0, failed = 0, code = "";
    await Promise.all(pending.map(async fund => {
      const before = JSON.stringify(fund);
      try {
        const res = await fetch("api/translate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fund }) });
        const reply = await res.json();
        if (!res.ok) { failed++; code = reply.error || "api"; return; }
        const state = FundStore.getState();                   // put it back only if the admin has not changed the fund meanwhile
        for (const list of Object.values(state.funds)) {
          const i = list.findIndex(f => f.id === fund.id);
          if (i > -1 && JSON.stringify(list[i]) === before) { list[i] = reply.fund; FundStore.setState(state); done++; return; }
        }
      } catch (e) { failed++; code = "network"; }
    }));
    return { done, failed, code };
  }
};
const localReady = Local.detect();
// Opened from this computer (localhost or a file) but without server.py: the usual cause of "why does it want a token?"
const onThisComputer = ["localhost", "127.0.0.1", "[::1]", ""].includes(location.hostname);

/* ---------- small status banner ---------- */
const toastEl = document.getElementById("toast");
let toastTimer = 0;
function toast(message, kind, sticky) {
  clearTimeout(toastTimer);
  toastEl.textContent = message;
  toastEl.className = "toast" + (kind ? " " + kind : "");
  toastEl.hidden = false;
  if (!sticky) toastTimer = setTimeout(() => { toastEl.hidden = true; }, 7000);
}
toastEl.addEventListener("click", () => { toastEl.hidden = true; });

/** Admin actions call this first. Without a GitHub token nothing can be saved for everyone, so the action is stopped. */
function needToken() {
  if (Repo.hasToken() || Local.on) return false;           // the local server can save to this computer without a token
  toast(t(onThisComputer ? "locNeedServer" : "ghNeedToken"), "warn", true);
  return true;
}

/* ---------- saving: changes made close together go out as one commit, one save at a time ---------- */
let saveTimer = 0, saveChain = Promise.resolve(), pollTimer = 0;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveChain = saveChain.then(runSave); }, 400);
}
async function runSave() {
  clearTimeout(pollTimer);
  let note = "";
  if (Local.on) {                                             // on this computer: translate first, so what is saved is already translated
    const waiting = Repo.untranslated(FundStore.getState());
    if (waiting) {
      toast(t("locTranslating")(waiting), "", true);
      const result = await Local.translatePending();
      applyLang();
      if (result.failed) note = " " + t("locErr_" + result.code);
    }
  }
  if (!Repo.hasToken()) {
    if (!Local.on) return toast(t("ghNotSaved") + " " + t("ghNeedToken"), "err", true);
    try {
      await Local.save(FundStore.getState());
      toast(t("locSaved") + note, note ? "warn" : "ok", !!note);
    } catch (e) { toast(t("ghNotSaved") + " " + t("locErr_save"), "err", true); }
    return;
  }
  toast(t("ghSaving"), "", true);
  try {
    const saved = await Repo.saveNow();
    applyLang();
    const waiting = Repo.untranslated(saved);
    if (waiting) { toast(t("ghSavedTranslating")(waiting), "", true); watchTranslation(0); }
    else toast(t("ghSaved"), "ok");
  } catch (e) {
    toast(t("ghNotSaved") + " " + t("ghErr_" + ((e && e.code) || "api")), "err", true);
  }
}
FundStore.onChange(queueSave);

/** After a save with untranslated funds: look at the repository every 10 seconds until the workflow has filled them in. */
function watchTranslation(tries) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      const remote = await Repo.readRemote();
      if (remote.state) {
        const merged = Repo.merge(FundStore.getState(), remote.state);
        if (!Repo.untranslated(merged)) {
          Repo.remember(merged); FundStore.setState(merged); applyLang();
          return toast(t("ghTranslated"), "ok");
        }
      }
    } catch (e) {}
    if (tries >= 30) return toast(t("ghTranslateSlow"), "warn", true);      // about five minutes
    watchTranslation(tries + 1);
  }, 10000);
}

/** "Translate" / "Translate Again" in View Fund: marks the fund so the workflow translates it from the language on screen. */
function translateNow(id) {
  if (!Auth.isAdmin() || needToken()) return;
  const hit = FundStore.find(id);
  if (!hit) return;
  closeD();
  const copy = JSON.parse(JSON.stringify(hit.fund));
  copy.translated = false;
  copy.translateFrom = lang;
  FundStore.update(id, copy, hit.strat);
  applyLang();
}

/* ---------- GitHub token box in the Add Fund window ---------- */
const ghInput = document.getElementById("ghInput"), ghStatus = document.getElementById("ghStatus");
function refreshTokenBox() {
  ghStatus.textContent = t(Repo.hasToken() ? "ghTokenSaved" : Local.on ? "locStatus" : onThisComputer ? "locNeedServer" : "ghTokenNone");
  ghStatus.classList.toggle("ok", Repo.hasToken());
  document.getElementById("ghRemove").hidden = !Repo.hasToken();
  document.getElementById("ghBox").open = !Repo.hasToken();          // show the instructions until a token is saved
  ghInput.value = "";
}
document.getElementById("ghSave").onclick = async () => {
  const k = ghInput.value.trim();
  if (!k) return;
  if (!Repo.setToken(k)) return toast(t("errStorage"), "err");
  refreshTokenBox();
  try { await Repo.readRemote(); toast(t("ghTokenOk"), "ok"); }       // check it straight away
  catch (e) { toast(t("ghErr_" + ((e && e.code) || "api")), "err", true); }
};
document.getElementById("ghRemove").onclick = () => { Repo.setToken(""); refreshTokenBox(); };
ghInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("ghSave").click(); } });

/* ---------- first load: show the shared funds ---------- */
(async () => {
  await localReady;
  let state = null;
  if (Repo.hasToken()) { try { state = (await Repo.readRemote()).state; } catch (e) {} }   // an admin gets the very latest
  if (!state) state = await Repo.readPublic();
  if (!state) return;
  FundStore.setState(state);
  Repo.remember(FundStore.getState());
  applyLang();
  if (Auth.isAdmin() && Repo.hasToken() && Repo.untranslated(FundStore.getState())) watchTranslation(0);
})();
</script>
<script>
/* ===== js/reorder.js ===== */
/* ---------- Drag a card to change the order of funds (admin only) ----------
   Each card has a grip button (six dots) in its top right corner. Press it and drag left or right; the other cards
   slide out of the way, and the row scrolls by itself near its edges. Releasing saves the new order for the open
   strategy tab through FundStore.reorder(), which is shared with everyone like any other change.
   Depends on: Auth, FundStore, needToken (repo.js), and tab / applyLang from app.js. */
(() => {
  const row = document.getElementById("track"), box = document.getElementById("scroller");
  let drag = null, scrollLoop = 0;

  // card centres are measured in the row's own coordinates, so they stay valid while the row scrolls
  const contentX = clientX => clientX + box.scrollLeft;

  row.addEventListener("pointerdown", e => {
    const grip = e.target.closest("[data-grip]");
    if (!grip || e.button > 0 || !Auth.isAdmin()) return;
    e.preventDefault();
    if (needToken()) return;
    const cards = [...row.querySelectorAll(".card")], card = grip.closest(".card"), from = cards.indexOf(card);
    if (cards.length < 2 || from < 0) return;
    const rects = cards.map(c => c.getBoundingClientRect());
    drag = {
      grip, card, cards, from, to: from, pointerId: e.pointerId,
      startX: contentX(e.clientX), lastClientX: e.clientX,
      centres: rects.map(r => r.left + r.width / 2 + box.scrollLeft),
      step: cards.length > 1 ? rects[1].left - rects[0].left : rects[0].width      // card width plus the gap
    };
    grip.setPointerCapture(e.pointerId);
    box.classList.add("reordering");
    card.classList.add("moving");
    autoScroll();
  });

  function place() {
    const dx = contentX(drag.lastClientX) - drag.startX;
    const centre = drag.centres[drag.from] + dx;
    // the new position is the number of other cards whose centre lies to the left of the dragged card's centre
    drag.to = drag.centres.filter((c, i) => i !== drag.from && c < centre).length;
    drag.cards.forEach((c, i) => {
      if (i === drag.from) c.style.transform = `translateX(${dx}px)`;
      else if (i > drag.from && i <= drag.to) c.style.transform = `translateX(${-drag.step}px)`;
      else if (i < drag.from && i >= drag.to) c.style.transform = `translateX(${drag.step}px)`;
      else c.style.transform = "";
    });
  }

  function autoScroll() {                                   // scroll the row while the pointer is held near either edge
    cancelAnimationFrame(scrollLoop);
    if (!drag) return;
    const r = box.getBoundingClientRect(), edge = 70, x = drag.lastClientX;
    const speed = x < r.left + edge ? -Math.min(18, (r.left + edge - x) / 4) : x > r.right - edge ? Math.min(18, (x - (r.right - edge)) / 4) : 0;
    if (speed) { box.scrollLeft += speed; place(); }
    scrollLoop = requestAnimationFrame(autoScroll);
  }

  row.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.lastClientX = e.clientX;
    place();
  });

  function finish(commit) {
    if (!drag) return;
    const { from, to, cards, card } = drag;
    cancelAnimationFrame(scrollLoop);
    cards.forEach(c => { c.style.transform = ""; });
    card.classList.remove("moving");
    box.classList.remove("reordering");
    drag = null;
    if (commit && to !== from) {
      const keep = box.scrollLeft;
      FundStore.reorder(tab, from, to);
      applyLang();
      box.scrollLeft = keep;
    }
  }
  row.addEventListener("pointerup", e => { if (drag && e.pointerId === drag.pointerId) finish(true); });
  row.addEventListener("pointercancel", () => finish(false));
  addEventListener("keydown", e => { if (e.key === "Escape") finish(false); });
})();
</script>
</body>
