<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Junson Capital brand: navy #1A2445, deep navy #121C3A, blue #081951, gold #DAB56E (from junsoncapital.com).
   The firm's site typeface is Masiva (commercial); Outfit is the closest free geometric substitute. */
:root{
  --navy:#1A2445; --navy-2:#121C3A; --deep:#081951; --ink:#141b33; --muted:#5d6580; --line:#e4e6ee;
  --bg:#f6f6f9; --card:#ffffff; --gold:#DAB56E; --pos:#1f7a5a; --neg:#b4443a; --neg-bg:#fbf1ef;
  --serif:'Outfit','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --sans:'Outfit','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
}
html[lang="zh-Hant"]{--serif:'Outfit','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;--sans:var(--serif)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{overscroll-behavior-x:none}   /* stop the browser swipe-back / swipe-forward gesture (Chrome, Edge, Firefox) */
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* NAV */
nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:.3s;background:transparent}
nav.solid{background:rgba(26,36,69,.97);box-shadow:0 1px 0 rgba(255,255,255,.06)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.logo{display:flex;align-items:center;gap:16px;color:#fff}
.logo img{height:38px;width:auto;display:block}
.logo small{font-size:10px;letter-spacing:3px;color:#b9bfd1;text-transform:uppercase;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;line-height:1.4}
.links{display:flex;gap:34px;font-size:12.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#fff}
.links a{position:relative;padding:6px 0;transition:color .2s}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.links a:hover,.links a.on{color:var(--gold)}
.links a:hover::after,.links a.on::after{transform:none}
.nav-right{display:flex;align-items:center;gap:20px}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:8px 2px;cursor:pointer;transition:color .2s}
.lang-btn:hover,.lang.open .lang-btn{color:var(--gold)}
.lang-btn svg{flex:none}
.lang-btn .chev{transition:transform .25s;opacity:.8}
.lang.open .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 14px);min-width:190px;background:#fff;box-shadow:0 18px 40px -12px rgba(18,28,58,.45);padding:8px 0;list-style:none;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s;border-top:2px solid var(--gold)}
.lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto}
.lang-menu button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;padding:11px 20px;font-family:var(--sans);font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.lang-menu button small{font-size:11px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.lang-menu button:hover{background:#f4f2ec}
.lang-menu button.on{color:var(--navy);font-weight:600}
.lang-menu button.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:auto}
.lang-menu button.on small{display:none}
.btn{display:inline-block;white-space:nowrap;padding:12px 26px;font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;border:1px solid var(--gold);color:#fff;transition:.25s;cursor:pointer;background:none;font-family:var(--sans)}
.btn:hover{background:var(--gold);color:var(--navy)}

/* HERO */
.hero{position:relative;min-height:86vh;display:flex;align-items:flex-end;color:#fff;padding:150px 0 90px;overflow:hidden;
  background:radial-gradient(1200px 600px at 80% 20%,#2c3a6a 0%,transparent 60%),linear-gradient(160deg,#1A2445 0%,#0f1733 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:80px 80px;
  mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.hero svg.lines{position:absolute;right:-60px;top:90px;width:60%;opacity:.5}
.hero .wrap{position:relative;width:100%}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:40px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,5.6vw,76px);line-height:1.08;max-width:920px;letter-spacing:-.5px}
.hero h1 b{font-weight:700}
.hero p{margin-top:26px;max-width:620px;font-size:17px;line-height:1.75;color:#c3c8d8;font-weight:300}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:70px;border-top:1px solid rgba(255,255,255,.14)}
.hero-stats div{padding:26px 24px 0 0}
.hero-stats b{display:block;font-family:var(--serif);font-size:clamp(30px,4.4vw,52px);font-weight:600;line-height:1.1}
.hero-stats span{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#9aa2ba}

/* SECTION */
section.funds{padding:110px 0 120px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:44px}
.sec-head>div{flex:none}
.sec-head h2{white-space:nowrap;font-family:var(--serif);font-weight:600;font-size:44px;color:var(--navy);line-height:1.1}
.sec-head p{color:var(--muted);max-width:460px;line-height:1.75;font-size:15px}

/* TABS */
.tabbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:38px}
.tabs{display:flex;gap:44px}
.tab{position:relative;padding:18px 0;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--sans);font-weight:500}
.tab .count{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:8px;border-radius:11px;background:var(--line);font-size:11px;color:var(--navy)}
.tab.active{color:var(--navy)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--navy)}
.tab.active .count{background:var(--navy);color:#fff}
.tab-desc{font-size:13px;color:var(--muted);margin-top:18px}

/* CAROUSEL: free horizontal scroll, mouse drag, keyboard */
.track-outer{overflow-x:auto;overflow-y:hidden;margin:0 -32px;padding:6px 32px 30px;scroll-padding-inline:32px;
  scroll-snap-type:x proximity;scrollbar-width:none;cursor:grab;outline:none;overscroll-behavior-x:none}
.track-outer::-webkit-scrollbar{display:none}
.track-outer.dragging{cursor:grabbing;scroll-snap-type:none}
.track-outer.dragging .card{pointer-events:none}
.track-outer:focus-visible{box-shadow:inset 0 0 0 2px rgba(218,181,110,.5)}
/* Shared row grid: every card spans the same 10 rows (tag, name, manager, KPIs, strategy, returns label,
   chart, drawdown label, drawdown, footer) via subgrid, so matching content lines up across cards. */
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px)/3);grid-template-rows:repeat(11,auto);column-gap:24px;row-gap:0;user-select:none}
.card{scroll-snap-align:start}
.card{grid-row:span 11;display:grid;grid-template-rows:subgrid;row-gap:0;background:var(--card);border:1px solid var(--line);transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 50px -24px rgba(26,36,69,.35)}
.card-top{grid-row:span 3;display:grid;grid-template-rows:subgrid;row-gap:0;align-items:start;padding:30px 30px 24px;background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
.card-top::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:1px solid rgba(218,181,110,.35);border-radius:50%}
.tag{display:inline-block;justify-self:start;align-self:start;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;padding:5px 10px;border:1px solid rgba(218,181,110,.6);color:var(--gold);margin-bottom:18px}
.card h3{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.2;align-self:start}
.card .mgr{font-size:12px;color:#aab1c6;letter-spacing:1px;margin-top:8px;text-transform:uppercase;align-self:end}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}
.kpis div{padding:18px 16px 16px 30px}
.kpis div+div{border-left:1px solid var(--line);padding-left:16px}
.kpis b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy);white-space:nowrap}
.kpis span{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.card-body{grid-row:span 6;display:grid;grid-template-rows:subgrid;row-gap:0;padding:22px 30px 26px}
.strategy{font-size:14px;line-height:1.7;color:#334155;align-self:start}
.mini-label{align-self:end;display:flex;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.mini-label span{white-space:nowrap}
.mini-label span+span{letter-spacing:.2px;text-transform:none;color:var(--navy);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:center;gap:6px;height:90px;position:relative;margin-bottom:18px}
.bars::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #cfd7e2}
.bar{flex:1;height:100%;position:relative}
.bar i{position:absolute;left:0;right:0;transition:height .8s cubic-bezier(.22,.8,.2,1)}
.bar i.p{bottom:50%;background:var(--navy)}
.bar i.n{top:50%;background:var(--neg)}
.bar.ytd i.p{background:var(--gold)}
.bar em{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;color:var(--muted)}
.bar:hover::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;padding:3px 6px;white-space:nowrap;z-index:2}

/* drawdown */
.dd{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:#fafbfd}
.dd div{padding:12px 14px}
.dd div+div{border-left:1px solid var(--line)}
.dd span{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dd b{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--neg)}
.dd b.none{color:var(--pos);font-size:15px;font-family:var(--sans)}
.dd small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.dd-xl div{padding:20px 22px}
.dd-xl b{font-size:30px}
.dd-xl b.none{font-size:18px}
.dd-xl small{font-size:12.5px}

.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;align-self:end;padding-top:18px;border-top:1px solid var(--line)}
.recent{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:22px;align-self:start}
.recent th{text-align:left;font-weight:500;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:0 0 7px;border-bottom:1px solid var(--navy)}
.recent td{padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.recent th:last-child,.recent td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.liq{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.liq::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.liq.semi::before{background:var(--gold)}
.more{position:relative;display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--navy);font-weight:600;font-family:var(--sans);white-space:nowrap;background:none;border:none;cursor:pointer;
  padding:16px 20px;margin:-16px -20px;transition:color .2s}   /* padding enlarges the click area; negative margin keeps the text where it was */
.more::before{content:"";position:absolute;inset:-4px -4px -10px -24px}   /* reach a bit further left and down, invisible */
.more svg{transition:transform .2s}
.more:hover,.more:focus-visible{color:var(--gold-ink,#a8823d)}
.more:hover svg{transform:translateX(3px)}
.progress{height:2px;background:var(--line);margin-top:10px;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);transition:.6s cubic-bezier(.22,.8,.2,1)}

/* DRAWER */
.scrim{position:fixed;inset:0;background:rgba(18,28,58,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.35s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:#fff;z-index:90;transform:translateX(100%);transition:transform .45s cubic-bezier(.22,.8,.2,1);overflow-y:auto}
.drawer.on{transform:none}
.d-head{background:var(--navy);color:#fff;padding:44px 48px 36px;position:relative}
.d-head h3{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin-top:4px}
.d-head p{color:#aab1c6;font-size:13px;margin-top:10px;letter-spacing:1px;text-transform:uppercase}
.close{position:absolute;right:28px;top:26px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;cursor:pointer;font-size:18px}
.close:hover{background:var(--gold);border-color:var(--gold)}
.d-body{padding:36px 48px 60px}
.d-body h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:32px 0 14px}
.d-body h4:first-child{margin-top:0}
.d-body p{font-size:15px;line-height:1.8;color:#334155}
.d-body .dd-note{font-size:13px;color:var(--muted);margin-top:10px}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.facts div{padding:16px 0;border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){padding-right:20px}
.facts span{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.facts b{font-weight:500;font-size:15px;color:var(--navy);line-height:1.5}
table.perf{width:100%;border-collapse:collapse;font-size:14px}
table.perf th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--navy)}
table.perf th:last-child,table.perf td:last-child{text-align:right}
table.perf td{padding:11px 0;border-bottom:1px solid var(--line)}
td.pos{color:var(--pos);font-weight:500} td.neg{color:var(--neg);font-weight:500}
.note{font-size:12px!important;color:var(--muted)!important;line-height:1.6!important;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}

/* FOOTER */
footer{background:#121C3A;color:#71839e;font-size:12px;line-height:1.8;padding:30px 0}
footer .wrap{text-align:center}   /* one centred line of disclosure; it wraps on narrow screens */

.reveal{opacity:0;transform:translateY(24px);transition:1s cubic-bezier(.22,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

html:not([lang="en"]) .tab,html:not([lang="en"]) .links,html:not([lang="en"]) .eyebrow{letter-spacing:2px}
html:not([lang="en"]) .hero h1{line-height:1.25}

@media (max-width:1000px){.track{grid-auto-columns:calc((100% - 24px)/2)}.links{display:none}}
@media (max-width:680px){
  .wrap{padding:0 16px}.track-outer{margin:0 -16px;padding:6px 16px 30px}
  .track{grid-auto-columns:88%}.sec-head{flex-direction:column;align-items:flex-start}.sec-head h2{font-size:34px}
  .tabbar{flex-direction:column;align-items:flex-start;gap:12px;padding-bottom:12px}.tabs{gap:24px}
  .d-head,.d-body{padding-left:24px;padding-right:24px}footer .wrap{display:block}
  .logo small{display:none}
}

/* ---------- Account button, login screen, Add Fund form ---------- */
[hidden]{display:none!important}
body.modal-open{overflow:hidden}
.acct{background:none;border:none;color:#fff;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;padding:8px 2px;white-space:nowrap;transition:color .2s}
.acct:hover{color:var(--gold)}
.btn.sm{padding:9px 16px;font-size:11.5px}
.btn.solid{background:var(--gold);color:var(--navy)}
.btn.solid:hover{background:#e6c88d}
.btn.ghost{border-color:var(--line);color:var(--navy)}
.btn.ghost:hover{background:var(--line);color:var(--navy)}

.login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;overflow-y:auto;
  background:radial-gradient(1000px 500px at 80% 10%,#2c3a6a 0%,transparent 60%),linear-gradient(160deg,#1A2445 0%,#0f1733 100%)}
.login-card{width:min(420px,100%);color:#fff}
.login-card img{height:46px;display:block;margin-bottom:44px}
.login-card h2{font-weight:600;font-size:30px;margin-bottom:10px}
.login-card>p{color:#c3c8d8;font-weight:300;line-height:1.6;margin-bottom:30px;font-size:15px}
.login-card label{display:block;margin-bottom:18px}
.login-card label span{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#aab1c6;margin-bottom:8px}
.login-card input{width:100%;padding:13px 14px;font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);outline:none;transition:border-color .2s}
.login-card input:focus{border-color:var(--gold)}
.login-card .btn{width:100%;margin-top:10px;padding:14px}
.login-card .link-btn{display:block;margin:16px auto 0;background:none;border:none;color:#aab1c6;font:inherit;font-size:13px;cursor:pointer}
.login-card .link-btn:hover{color:#fff}
.form-err{color:#f0a49b!important;font-size:13.5px!important;margin:0 0 12px!important}
.login-lang{margin-top:34px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);display:flex;gap:22px}
.login-lang button{background:none;border:none;color:#aab1c6;font:inherit;font-size:13px;cursor:pointer;padding:0}
.login-lang button:hover{color:#fff}
.login-lang button.on{color:var(--gold);font-weight:600}

.modal{position:fixed;inset:0;z-index:150;background:rgba(18,28,58,.6);backdrop-filter:blur(3px);overflow-y:auto;padding:40px 16px}
.modal-card{width:min(760px,100%);margin:0 auto;background:#fff}
.modal-head{background:var(--navy);color:#fff;padding:26px 36px;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-weight:600;font-size:24px}
.modal-head .close{position:static}
.modal-body{padding:30px 36px 8px;display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.modal-body label{display:block;min-width:0}
.modal-body label.wide{grid-column:1/-1}
.modal-body label>span{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.modal-body small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;padding:11px 12px;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid #cfd3df;outline:none;transition:border-color .2s}
.modal-body textarea{resize:vertical;min-height:84px;line-height:1.6}
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{border-color:var(--navy)}
.modal-foot{padding:14px 36px 32px;display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
.modal-foot .form-err{color:var(--neg)!important;margin:0!important;flex:1 1 100%}
.btn.danger{border-color:var(--neg);color:var(--neg);margin-top:26px}
.btn.danger:hover{background:var(--neg);color:#fff}
@media (max-width:680px){.modal-body{grid-template-columns:1fr;padding:24px 20px 4px}.modal-head,.modal-foot{padding-left:20px;padding-right:20px}.acct{font-size:11px;letter-spacing:.8px}}

/* Investor view: the card header holds only the title, so let it sit a little lower */
.d-head h3:first-of-type{margin-top:4px}

/* Text wordmark used in place of a logo image: top bar, login screen and footer */
.wordmark{color:#fff;font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:2.6px;text-transform:uppercase;line-height:1.35;white-space:nowrap}
.login-card .wordmark{font-size:17px;margin-bottom:44px}
footer .wordmark{font-size:14px}
html:not([lang="en"]) .wordmark{font-size:19px;letter-spacing:5px}

/* drop zone for the deck upload */

/* ---------- Strategy tabs: any number of tabs, admin add / delete ---------- */

/* ---------- Edit / Delete controls (admin) ---------- */
.card-tools{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px}

  padding:14px 22px;font-size:14px;line-height:1.5;box-shadow:0 18px 40px -12px rgba(18,28,58,.55);border-left:3px solid var(--gold);cursor:pointer}
.toast.ok{border-left-color:#4fbf93}

/* ---------- Drag a card to reorder (admin) ---------- */
.tool.grip{cursor:grab;touch-action:none}

/* note above the yearly table in View Fund */
.d-body .perf-cap{font-size:13px;line-height:1.65;color:var(--muted);margin:-4px 0 14px}

/* ---- liquidity band on every card (its own row, so it lines up across cards) ---- */
.liq-row{display:flex;align-items:center;gap:9px;padding:13px 30px;border-bottom:1px solid var(--line);color:var(--muted)}

/* ---- previous / next buttons beside the tabs ---- */
.pager{display:flex;gap:10px;flex:none;margin-left:24px}

/* ---- cover-page numbers an admin can edit in place ---- */

/* ---- monthly returns: thumbnail in View Fund, table window, picture upload ---- */
.mo-thumb{display:flex;align-items:center;gap:16px;width:100%;margin-top:20px;padding:14px 16px;border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.mo-thumb:hover,.mo-thumb:focus-visible{border-color:var(--navy);box-shadow:0 10px 24px -16px rgba(26,36,69,.5);outline:none}
.mo-thumb .mo-pic{flex:none;padding:6px;border:1px solid var(--line);background:#fafbfd;box-sizing:content-box}
.mo-thumb span{flex:1;min-width:0}

.mo-thumb>svg:last-child{flex:none;transition:transform .2s}

.modal-card.wide{width:min(1080px,100%)}
#moTitle small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;letter-spacing:1.2px;text-transform:uppercase;color:#aab1c6;margin-top:6px}
.mo-body{padding:26px 36px 4px}
.mo-scroll{overflow-x:auto}

table.mo td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink)}

.mo-note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:14px}
.mo-field>span,.im-mo>span{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.mo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mo-drop,.modal-body label.mo-drop{position:relative;flex:1;min-width:220px;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px dashed #c3c8d6;background:#fafbfd;color:var(--navy);cursor:pointer;transition:border-color .2s,background .2s}
.mo-drop svg{flex:none;color:var(--gold)}
.mo-drop b{display:block;font-size:13.5px;font-weight:600}

.mo-drop input,.modal-body .mo-drop input{position:absolute;width:1px;height:1px;min-width:0;padding:0;border:0;opacity:0;pointer-events:none}   /* the whole box is the click target */
.mo-drop:hover,.mo-drop:focus-within{border-color:var(--navy)}
.mo-drop.drag{border-color:var(--gold);border-style:solid;background:#fbf6ea}
textarea.mo-text,.modal-body textarea.mo-text{display:block;width:100%;margin-top:10px;padding:10px 12px;border:1px solid #cfd3df;background:#fff;color:var(--ink);outline:none;resize:vertical;font:12px/1.7 ui-monospace,Consolas,"Courier New",monospace;white-space:pre;overflow:auto;min-height:120px;tab-size:8}
.modal-body .mo-field{grid-column:1/-1;min-width:0}
.im-moedit small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.im-mo{display:block;margin-top:14px}
.mo-status{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.mo-status.ok{color:var(--pos)}.mo-status.warn{color:#b7791f}.mo-status.err{color:var(--neg)}

/* ---- share classes: fees and liquidity terms per class, in View Fund ---- */
.cls-scroll{overflow-x:auto}
table.cls{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.4}
table.cls th{font-weight:500;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);text-align:center;vertical-align:bottom;padding:8px 7px;border-bottom:1px solid var(--navy)}
table.cls td{text-align:center;padding:10px 7px;border-bottom:1px solid var(--line);color:var(--ink)}
table.cls th:first-child,table.cls td:first-child{text-align:left;padding-left:0;white-space:nowrap;font-weight:600;color:var(--navy)}

.im-moedit,.im-cledit{margin-top:14px}
.im-sub{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.im-moedit small,.im-cledit small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.im-moedit small.mo-status.err,.im-cledit small.mo-status.err{color:var(--neg)}
.im-moedit small.mo-status.warn{color:#b7791f}
.modal-body label.mo-keep{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink);cursor:pointer}
.modal-body .mo-keep input{width:auto;padding:0;flex:none}
.mo-keep i{font-style:normal}

/* ---- category tabs: the strategies of a category drop down as a list while the mouse is over it ---- */
.tab-group{position:relative}
.tab-sub{margin-left:12px;padding-left:12px;border-left:1px solid #cfd3df;font-weight:400;letter-spacing:1px;color:var(--muted)}
.tab-menu{display:none;position:absolute;top:100%;left:-18px;z-index:40;min-width:250px;padding:8px 0;background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(26,36,69,.4)}
/* the list fades and slides in under the tab, and fades out a moment after the mouse leaves */
.tab-menu{display:block;visibility:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s ease .06s,transform .2s ease .06s,visibility 0s linear .26s}
.tab-group:hover .tab-menu,.tab-group.open .tab-menu{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .22s ease,transform .26s cubic-bezier(.22,.8,.2,1),visibility 0s}
.tab-group.shut .tab-menu{visibility:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:none}
.tab-menu .sub{transition:background .18s ease,color .18s ease,padding-left .18s ease}
.tab-menu .sub:not(.active):hover{padding-left:24px}
.tab{transition:color .25s ease}
.tab .count{transition:background .25s ease,color .25s ease}
.tab.moved.active::after{animation:tabline .35s cubic-bezier(.22,.8,.2,1)}
.tab.renamed .tab-sub{animation:subin .35s ease}
@keyframes tabline{from{transform:scaleX(0)}to{transform:none}}
@keyframes subin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.tab.active::after{transform-origin:left}
/* switching strategy: old cards fade out, new cards rise in one after another */
.track.swap-out{opacity:0;transform:translateY(10px);transition:opacity .17s ease,transform .17s ease}
.track.swap-in>*{animation:cardin .5s cubic-bezier(.22,.8,.2,1) both;animation-delay:var(--rise,0ms)}
@keyframes cardin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tab-menu,.tab-group:hover .tab-menu,.tab-group.open .tab-menu{transition:none}.tab.moved.active::after,.tab.renamed .tab-sub,.track.swap-in>*{animation:none}}
.tab-menu .sub{display:flex;align-items:center;width:100%;padding:12px 18px;background:none;border:none;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap;cursor:pointer}
.tab-menu .sub>span:first-child{flex:1}
.tab-menu .sub:hover{background:#f6f6f9;color:var(--navy)}
.tab-menu .sub.active{color:var(--navy)}
.tab-menu .sub.active>span:first-child{box-shadow:inset 2px 0 0 var(--gold);margin-left:-18px;padding-left:16px}
.tab-menu .count{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:14px;border-radius:11px;background:var(--line);font-size:11px;color:var(--navy)}
.tab-menu .sub.active .count{background:var(--navy);color:#fff}
.tab-menu .tab-add{display:block;width:100%;margin-top:6px;padding:12px 18px;background:none;border:none;border-top:1px solid var(--line);font-family:var(--sans);text-transform:uppercase;text-align:left;cursor:pointer}
.tab-menu .strat-new{padding:8px 14px}
.tab-empty{padding:10px 18px;font-size:13px;color:var(--muted);white-space:nowrap}
html:not([lang="en"]) .tab-menu .sub{letter-spacing:2px}
@media (max-width:680px){.tab-sub{display:none}.tab-menu{left:0}}
.track-empty{grid-column:1/-1;grid-row:1/-1;padding:44px 0 60px;font-size:15px;color:var(--muted)}

/* ---- Focus List: the star on each card (admins) ---- */
.tool.star.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.tool.star.on svg{fill:currentColor}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-self:start;align-self:start;margin-bottom:18px}

.has-tools .tags{max-width:calc(100% - 136px)}             /* four buttons now: star, grip, edit, delete */
.has-tools .tags .tag{max-width:100%}
.has-tools .tag{max-width:calc(100% - 136px)}

/* ---- top picks (gold star, top-left of the card) and My Focus List (bookmark in the card foot) ---- */
.pick{fill:var(--gold);flex:none}
.pick-wrap{position:absolute;top:9px;left:28px;z-index:2;display:inline-flex;align-items:center;gap:7px;line-height:1}

.pick-wrap em{font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);padding-left:8px;border-left:1px solid rgba(218,181,110,.45)}
html:not([lang="en"]) .pick-wrap em{letter-spacing:3px}
.tab-desc{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.pick-note{display:inline-flex;align-items:center;gap:7px;color:var(--navy);font-weight:500}
.pick-note .pick{width:15px;height:15px}
.card-foot{justify-content:space-between}
.save{display:inline-flex;align-items:center;gap:7px;padding:0;background:none;border:none;font-family:var(--sans);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:color .2s}
.save:hover,.save:focus-visible{color:var(--navy)}
.save.on{color:var(--gold-ink,#a8823d)}

.d-save{margin-top:26px}

/* a larger click area for the Focus List button: the padding is cancelled by the margin, so nothing moves */

/* ---- signing in and out: the login screen fades, and the page behind fades and rises back in ---- */
.login{opacity:0;transition:opacity .3s ease}
.login.in{opacity:1}

@media (prefers-reduced-motion:reduce){.login,.login-card{transition:none}body.auth-in #track>*,body.auth-in #tabs,body.auth-in #acctBtn,body.auth-in #addFundBtn{animation:none}}

/* ---- windows (Add Fund, Edit, monthly table): fade in while the panel rises; fade out on close ---- */
.modal:not([hidden]){animation:modalfade .26s ease both}
.modal:not([hidden]) .modal-card{animation:modalrise .42s cubic-bezier(.22,.8,.2,1) both}
.modal.closing{animation:modalout .22s ease both;pointer-events:none}
.modal.closing .modal-card{animation:modalsink .22s ease both}
@keyframes modalfade{from{opacity:0}to{opacity:1}}
@keyframes modalout{from{opacity:1}to{opacity:0}}
@keyframes modalrise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes modalsink{from{opacity:1;transform:none}to{opacity:0;transform:translateY(12px)}}
/* the funds read from a deck appear one after another in the Add Fund window */
.im-item{animation:cardin .45s cubic-bezier(.22,.8,.2,1) both}
.im-item:nth-child(2){animation-delay:70ms}.im-item:nth-child(3){animation-delay:140ms}.im-item:nth-child(n+4){animation-delay:200ms}
.im-status{transition:color .2s ease}
/* cards just added from a deck: rise in, with a gold outline that fades away */
.card.just-added,.track.swap-in>.card.just-added,body.auth-in #track>.card.just-added{animation:addedglow 3s ease both}   /* its delay is set on the card: minus the time since it was added */
@keyframes addedglow{0%{box-shadow:0 0 0 2px var(--gold),0 24px 50px -24px rgba(218,181,110,.9)}100%{box-shadow:0 0 0 2px rgba(218,181,110,0),0 0 0 0 rgba(218,181,110,0)}}
@media (prefers-reduced-motion:reduce){.modal:not([hidden]),.modal:not([hidden]) .modal-card,.modal.closing,.modal.closing .modal-card,.im-item,.card.just-added{animation:none}}

/* ---- changing language: the wording fades out, is swapped, and fades back in ---- */
body.lang-anim nav .links,body.lang-anim nav .logo,body.lang-anim #acctBtn,body.lang-anim #addFundBtn,body.lang-anim #langCur,
body.lang-anim .hero .wrap,body.lang-anim .funds .wrap,body.lang-anim footer .wrap,body.lang-anim .drawer>*,body.lang-anim .login-card>*,body.lang-anim .modal-card>*{transition:opacity .22s ease,transform .3s cubic-bezier(.22,.8,.2,1)}
body.lang-out nav .links,body.lang-out nav .logo,body.lang-out #acctBtn,body.lang-out #addFundBtn,body.lang-out #langCur,
body.lang-out .hero .wrap,body.lang-out .funds .wrap,body.lang-out footer .wrap,body.lang-out .drawer>*,body.lang-out .login-card>*,body.lang-out .modal-card>*{opacity:0;transition:opacity .18s ease}
body.lang-out .hero .wrap,body.lang-out .funds .wrap{transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}

/* ================= cover entrance and scrolling ================= */
html{scroll-behavior:smooth}
/* --- the cover builds itself on load --- */
nav{animation:navdrop .9s cubic-bezier(.22,.8,.2,1) both}
@keyframes navdrop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.hero svg.lines path{stroke-dasharray:1;stroke-dashoffset:1;animation:linedraw 2.4s cubic-bezier(.45,.05,.2,1) .25s forwards}
.hero svg.lines path:nth-child(2){animation-delay:.5s}
.hero svg.lines path:nth-child(3){animation-delay:.75s}
@keyframes linedraw{to{stroke-dashoffset:0}}
.hero .eyebrow{animation:fadeup .8s cubic-bezier(.22,.8,.2,1) .35s both}
.hero .eyebrow::before{transform-origin:left;animation:growx .9s cubic-bezier(.22,.8,.2,1) .35s both}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
.hero h1{animation:wipeup 1.15s cubic-bezier(.19,.9,.22,1) .5s both}
@keyframes wipeup{from{opacity:0;transform:translateY(34px);clip-path:inset(0 0 100% 0)}60%{opacity:1}to{opacity:1;transform:none;clip-path:inset(-10% -5% -15% -5%)}}
.hero .wrap>p{animation:fadeup .95s cubic-bezier(.22,.8,.2,1) .85s both}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero-stats{position:relative;border-top-color:transparent}
.hero-stats::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:rgba(255,255,255,.14);transform-origin:left;animation:growx 1.3s cubic-bezier(.45,.05,.2,1) 1s both}
.hero-stats>div{animation:fadeup .9s cubic-bezier(.22,.8,.2,1) 1.15s both}
.hero-stats>div:nth-child(2){animation-delay:1.27s}
.hero-stats>div:nth-child(3){animation-delay:1.39s}
.hero-stats b{font-variant-numeric:tabular-nums}
/* --- a quiet cue to scroll: a line with a gold bead travelling down it --- */
.scroll-cue{position:absolute;left:50%;bottom:22px;width:26px;height:46px;margin-left:-13px;display:grid;justify-items:center;opacity:calc(.9 - var(--p,0)*7)}   /* fades as soon as the page is scrolled; the entrance is on its parts so this stays in charge */
.scroll-cue::before{content:"";width:1px;height:100%;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.35));animation:authfade 1s ease 2s both}
.scroll-cue i{position:absolute;top:0;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:0;animation:cuedrop 2.2s cubic-bezier(.6,0,.3,1) 2.4s infinite}
@keyframes cuedrop{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(42px);opacity:0}}
/* --- scrolling away from the cover: the text sinks and fades, the curves rise and turn slightly --- */
.hero .wrap{transform:translateY(calc(var(--p,0)*70px));opacity:calc(1 - var(--p,0)*1.35);will-change:transform,opacity}
.hero svg.lines{transform-origin:100% 40%;transform:translateY(calc(var(--p,0)*-60px)) rotate(calc(var(--p,0)*-5deg)) scale(calc(1 + var(--p,0)*.06));will-change:transform}
.hero::before{transform:translateY(calc(var(--p,0)*40px))}
/* --- sections further down: the heading is wiped in, its line extends, the rest follows --- */
.reveal{transition:opacity .9s ease,transform 1s cubic-bezier(.22,.8,.2,1)}
.sec-head.reveal .eyebrow::before{transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.22,.8,.2,1) .15s}
.sec-head.reveal.in .eyebrow::before{transform:none}
.sec-head.reveal h2{clip-path:inset(0 0 100% 0);transform:translateY(22px);transition:clip-path 1s cubic-bezier(.19,.9,.22,1) .12s,transform 1s cubic-bezier(.19,.9,.22,1) .12s}
.sec-head.reveal.in h2{clip-path:inset(-10% -5% -20% -5%);transform:none}
.sec-head.reveal>p{opacity:0;transform:translateY(16px);transition:opacity .9s ease .3s,transform .9s cubic-bezier(.22,.8,.2,1) .3s}
.sec-head.reveal.in>p{opacity:1;transform:none}
.tabbar.reveal{transition-delay:.18s}
/* --- the fund cards rise one after another the first time the row comes into view --- */
#scroller:not(.seen) .track{opacity:0}
.track.enter>*{animation:cardrise 1s cubic-bezier(.19,.9,.22,1) both}
.track.enter>:nth-child(2){animation-delay:.12s}
.track.enter>:nth-child(3){animation-delay:.24s}
.track.enter>:nth-child(n+4){animation-delay:.34s}
@keyframes cardrise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  nav,.hero .eyebrow,.hero .eyebrow::before,.hero h1,.hero .wrap>p,.hero-stats::before,.hero-stats>div,.scroll-cue::before,.scroll-cue i,.track.enter>*{animation:none}
  .hero svg.lines path{animation:none;stroke-dashoffset:0}
  .hero .wrap{transform:none;opacity:1}
  .hero svg.lines,.hero::before{transform:none}
  .sec-head.reveal h2{clip-path:none;transform:none}.sec-head.reveal>p{opacity:1;transform:none}.sec-head.reveal .eyebrow::before{transform:none}
  #scroller:not(.seen) .track{opacity:1}
}
@media (max-width:680px){.scroll-cue{display:none}}
</style>
</head>

<script>
/* ===== js/fund-store.js ===== */
/* ---------- Fund store ----------
   Strategies sit in two fixed categories: "liquid" (Liquid) and "closed" (Closed-End / Semi-Liquid).
   Built-in funds come from js/funds-data.js and fill the three built-in strategies of the Liquid category:
   "liquid" (Daily), "monthly" (Monthly) and "illiquid" (Quarterly).
   Everything admins change lives in ONE shared file in the repository, data/funds.json, so every visitor sees it:
     strategies  [ { id, name, group } ]     strategies admins added, in display order; group is "liquid" or "closed"
     funds       { strategyId: [fund, ...] } funds admins added
     hidden      [ fundId, ... ]             built-in funds admins deleted
     overrides   { fundId: { fund, strat } } edited built-in funds (js/funds-data.js itself is never changed)
     order       { strategyId: [fundId, ...] } card order admins set by dragging; funds not listed come after
     removed     [ built-in strategy id ]    built-in strategies admins deleted
     names       { built-in strategy id: name }      built-in strategies admins renamed
     stats       [ "130+", "40+", "9" ]      the three cover-page numbers, once an admin has edited them
     featured    [ fundId, ... ]             top picks: funds admins marked with a star
   This file only holds that state in memory and rebuilds the live FUNDS list from it.
   Loading and saving the file is done by js/repo.js, which is told about every change through onChange(). */
const FundStore = (() => {
  const BUILT_IN = ["liquid", "monthly", "illiquid"];
  const clone = x => JSON.parse(JSON.stringify(x));
  const isBuiltInFund = id => String(id).startsWith("b-");

  // js/funds-data.js lists the built-in funds under "liquid" and "illiquid"; a fund's id comes from its place there and
  // never changes. A fund marked `home` then moves to that built-in strategy (PARS IV: monthly dealing) with its id.
  const LISTED = ["liquid", "illiquid"];
  LISTED.forEach(s => FUNDS[s].forEach((f, i) => { f.id = `b-${s}-${i}`; f.builtIn = true; }));       // stable ids for built-ins
  BUILT_IN.forEach(s => { FUNDS[s] = FUNDS[s] || []; });
  LISTED.forEach(s => { FUNDS[s] = FUNDS[s].filter(f => !(f.home && f.home !== s && FUNDS[f.home] && FUNDS[f.home].push(f))); });
  const ORIGINAL = clone(Object.fromEntries(BUILT_IN.map(s => [s, FUNDS[s]])));                      // pristine copy to rebuild from

  const empty = () => ({ strategies: [], funds: {}, hidden: [], overrides: {}, order: {}, removed: [], names: {}, featured: [] });
  const normalise = s => ({
    strategies: Array.isArray(s && s.strategies) ? s.strategies : [],
    funds: s && s.funds && typeof s.funds === "object" ? s.funds : {},
    hidden: Array.isArray(s && s.hidden) ? s.hidden : [],
    overrides: s && s.overrides && typeof s.overrides === "object" ? s.overrides : {},
    order: s && s.order && typeof s.order === "object" ? s.order : {},
    removed: Array.isArray(s && s.removed) ? s.removed.filter(id => BUILT_IN.includes(id)) : [],
    names: Object.fromEntries(BUILT_IN.filter(id => s && s.names && typeof s.names[id] === "string" && s.names[id]).map(id => [id, s.names[id].slice(0, 200)])),
    stats: Array.isArray(s && s.stats) && s.stats.length === 3 ? s.stats.map(x => String(x).slice(0, 12)) : null,
    featured: Array.isArray(s && s.featured) ? [...new Set(s.featured.map(String))] : []
  });
  let state = empty();
  let listener = () => {};

  const locate = id => {                                              // where a fund currently sits in the live list
    for (const strat of Object.keys(FUNDS)) {
      const index = FUNDS[strat].findIndex(f => f.id === id);
      if (index > -1) return { strat, index };
    }
    return null;
  };

  /** Rebuilds the live FUNDS list from the built-in funds plus the shared state. */
  function rebuild() {
    Object.keys(FUNDS).forEach(k => delete FUNDS[k]);
    BUILT_IN.forEach(s => { FUNDS[s] = clone(ORIGINAL[s]).filter(f => !state.hidden.includes(f.id)); });
    state.strategies.forEach(s => { FUNDS[s.id] = []; });
    Object.entries(state.overrides).forEach(([id, o]) => {
      const at = locate(id);
      if (!at || !o || !o.fund) return;
      if (o.strat === at.strat || !FUNDS[o.strat]) FUNDS[at.strat][at.index] = clone(o.fund);        // edited in place
      else { FUNDS[at.strat].splice(at.index, 1); FUNDS[o.strat].push(clone(o.fund)); }              // edited and moved
    });
    state.removed.forEach(id => { delete FUNDS[id]; });                                              // deleted built-in tabs, after funds edited out of them have moved
    Object.keys(state.funds).forEach(id => {
      if (FUNDS[id] && Array.isArray(state.funds[id])) FUNDS[id].push(...clone(state.funds[id]));    // funds of a deleted strategy are ignored
    });
    Object.entries(state.order).forEach(([strat, ids]) => {                                          // apply the dragged order
      if (!FUNDS[strat] || !Array.isArray(ids)) return;
      const rank = f => { const i = ids.indexOf(f.id); return i < 0 ? Infinity : i; };              // unlisted funds keep their place at the end
      FUNDS[strat] = FUNDS[strat].map((f, i) => ({ f, i })).sort((a, b) => rank(a.f) - rank(b.f) || a.i - b.i).map(x => x.f);
    });
    // top picks lead their strategy: starred funds first, each group keeping the order set above
    if (state.featured.length) Object.keys(FUNDS).forEach(strat => {
      const picks = FUNDS[strat].filter(f => state.featured.includes(f.id));
      if (picks.length) FUNDS[strat] = [...picks, ...FUNDS[strat].filter(f => !state.featured.includes(f.id))];
    });
  }
  const changed = () => { rebuild(); listener(); };

  return {
    /** The shared state as plain data (a copy). */
    getState: () => clone(state),
    /** Replaces the shared state, for example after loading data/funds.json. Does not trigger a save. */
    setState(s) { state = normalise(clone(s || {})); rebuild(); },
    /** Registers the function called after every change an admin makes (js/repo.js saves to GitHub there). */
    onChange(fn) { listener = fn; },

    /** All strategies in display order: the built-in ones (Liquid category), then the added ones. Each has `group`. */
    strategies: () => [
      ...BUILT_IN.filter(id => !state.removed.includes(id)).map(id => ({ id, builtIn: true, group: "liquid", name: state.names[id] || "" })),
      ...state.strategies.map(s => ({ ...s, group: s.group === "liquid" ? "liquid" : "closed" }))],
    isBuiltIn: id => BUILT_IN.includes(id),

    /** Creates a strategy in a category ("liquid" or "closed"). `name` must already be safe to insert as HTML. Returns it. */
    addStrategy(name, group) {
      const s = { id: "s-" + Date.now(), name, group: group === "liquid" ? "liquid" : "closed" };
      state.strategies.push(s);
      changed();
      return s;
    },
    /** Renames a strategy tab. `name` must already be safe to insert as HTML. A built-in tab given an empty name goes
        back to its original name, which is the only one shown in three languages. Returns false for an unknown tab. */
    renameStrategy(id, name) {
      if (BUILT_IN.includes(id)) { if (name) state.names[id] = name; else delete state.names[id]; }
      else {
        const s = state.strategies.find(x => x.id === id);
        if (!s || !name) return false;
        s.name = name;
      }
      changed();
      return true;
    },
    /** Removes a strategy tab together with the funds in it. */
    removeStrategy(id) {
      if (BUILT_IN.includes(id)) {
        if (!state.removed.includes(id)) state.removed.push(id);
        delete state.funds[id];                                                                      // funds admins added to it
        delete state.order[id];
        changed();
        return;
      }
      Object.entries(state.overrides).forEach(([fid, o]) => {                                        // built-ins moved here go too
        if (o && o.strat === id) { if (!state.hidden.includes(fid)) state.hidden.push(fid); delete state.overrides[fid]; }
      });
      state.strategies = state.strategies.filter(s => s.id !== id);
      delete state.funds[id];
      delete state.order[id];
      changed();
    },

    /** Finds a fund by id. Returns { fund, strat } or null. */
    find(id) {
      const at = locate(id);
      return at ? { fund: FUNDS[at.strat][at.index], strat: at.strat } : null;
    },

    /** Adds a fund under a strategy id. */
    add(strategyId, fund) {
      (state.funds[strategyId] = state.funds[strategyId] || []).push(fund);
      changed();
      return true;
    },

    /** Replaces a fund with an edited copy, optionally moving it to another strategy. Works for built-in and added funds. */
    update(id, fund, strategyId) {
      const at = locate(id);
      if (!at || !FUNDS[strategyId]) return false;
      fund.id = id;
      if (isBuiltInFund(id)) {
        fund.builtIn = true;
        state.overrides[id] = { fund, strat: strategyId };
      } else {
        const list = state.funds[at.strat] || [], i = list.findIndex(f => f.id === id);
        if (strategyId === at.strat && i > -1) list[i] = fund;
        else { if (i > -1) list.splice(i, 1); (state.funds[strategyId] = state.funds[strategyId] || []).push(fund); }
      }
      changed();
      return true;
    },

    /** Ids of the top picks that are on the site. */
    featured: () => state.featured.filter(id => locate(id)),
    isFeatured: id => state.featured.includes(id),
    /** Marks a fund as a top pick, or clears the mark. */
    toggleFeatured(id) {
      state.featured = state.featured.includes(id) ? state.featured.filter(x => x !== id) : [...state.featured.filter(x => locate(x)), id];
      changed();
    },

    /** Deletes a fund. An added fund is removed for good; a built-in fund is hidden. */
    remove(id) {
      state.featured = state.featured.filter(x => x !== id);
      if (isBuiltInFund(id)) {
        if (!state.hidden.includes(id)) state.hidden.push(id);
        delete state.overrides[id];
      } else {
        Object.keys(state.funds).forEach(s => { state.funds[s] = state.funds[s].filter(f => f.id !== id); });
      }
      changed();
    },

    /** Moves the card at position `from` to position `to` within one strategy tab. */
    reorder(strategyId, from, to) {
      const ids = (FUNDS[strategyId] || []).map(f => f.id);
      if (from < 0 || from >= ids.length || to < 0 || to >= ids.length || from === to) return false;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      state.order[strategyId] = ids;
      changed();
      return true;
    },


    /** The three cover-page numbers as edited by an admin, or null when they are still the ones in index.html. */
    stats: () => (state.stats ? [...state.stats] : null),
    setStats(list) { state.stats = list.map(x => String(x).slice(0, 12)); changed(); },

    exportJSON: () => JSON.stringify(state, null, 2)
  };
})();
</script>
<script>
/* ===== js/auth.js ===== */
/* ---------- Auth (demo, browser-only) ----------
   One small object so the rest of the site never touches credentials directly.
   To connect a real backend later, rewrite login()/logout() to call your API and keep the same return shapes. */
const Auth = (() => {
  const KEY = "jc-session";
  let current = null;
  try { current = JSON.parse(sessionStorage.getItem(KEY)); } catch (e) {}

  function save() {
    try {
      if (current) sessionStorage.setItem(KEY, JSON.stringify(current));
      else sessionStorage.removeItem(KEY);
    } catch (e) {}
  }

  return {
    /** Signed-in user ({username, role, name}) or null. The session ends when the browser tab closes. */
    user: () => current,
    isAdmin: () => !!current && current.role === "admin",

    /** Returns true on success, false on a wrong username or password. */
    login(username, password) {
      const u = CONFIG.DEMO_USERS.find(x => x.username.toLowerCase() === String(username).trim().toLowerCase() && x.password === password);
      if (!u) return false;
      current = { username: u.username, role: u.role, name: u.name };
      save();
      return true;
    },

    logout() { current = null; save(); }
  };
})();
</script>
<script>
/* ===== js/app.js ===== */
/* ---------- helpers ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let lang="en", tab="liquid";
try{ const s=localStorage.getItem("jc-lang"); if(UI[s]) lang=s }catch(e){}
const t=k=>UI[lang][k];
const L=o=>o?(o[lang]||o.en):"";
const zh=()=>lang!=="en";
// Free-text fields of added funds hold either one text (shown in every language) or, once translated, { en, sc, tc }.
const LX=v=>v&&typeof v==="object"&&!Array.isArray(v)?(v[lang]||v.en||""):v||"";
/* Inception is held two ways: `inception` ("YYYY-MM", from the Inception month field) and optional free text.
   The month is the authority when it is set. Without it, a year at the start of the text is used, so
   "2025 (first year)" still puts 2025 on the card. */
const LEAD_DATE=/^\s*((?:19|20)\d{2})(?:\s*[\/\-.年]\s*\d{1,2}\s*月?)?\s*/;
const incYear=f=>{
  if(f.inception) return f.inception.slice(0,4);
  const texts=f.inceptionText&&typeof f.inceptionText==="object"?[LX(f.inceptionText),...Object.values(f.inceptionText)]:[f.inceptionText];
  for(const x of texts){const m=String(x||"").match(LEAD_DATE); if(m) return m[1]}
  return "";
};
/** Inception as shown in View Fund: the month first, then the free text without its own leading date. */
function incShown(f){
  const text=LX(f.inceptionText);
  if(!f.inception) return text?R(f,text):"—";
  const rest=text.replace(LEAD_DATE,"");
  return ym(f.inception)+(rest?(/^[(（;；,，]/.test(rest)?" ":"<br>")+R(f,rest):"");
}
const notesOf=f=>Array.isArray(f.perfNotes)?f.perfNotes:(f.perfNotes&&(f.perfNotes[lang]||f.perfNotes.en))||[];
const fmt=v=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(2)+"%";
const ym=s=>{const [y,m]=s.split("-");return zh()?`${y}年${+m}月`:`${MON[m-1]} ${y}`};
const money=bn=>zh()?`${+(bn*10).toFixed(1)}亿美元`.replace("亿",lang==="tc"?"億":"亿"):`US$${bn.toFixed(bn<10?2:1)}bn`;
const perLabel=([y,,k,m])=>k==="ytd"?(zh()?`${y} YTD (至${m}月)`:`${y} YTD (to ${MON[m-1]})`):k==="p"?(zh()?`${y} (${m}月起)`:`${y} (from ${MON[m-1]})`):y;
const ann=p=>{const f=p.filter(x=>!x[2]);if(!f.length)return null;return(Math.pow(f.reduce((a,x)=>a*(1+x[1]/100),1),1/f.length)-1)*100};
/* Yearly returns shown on the card: the latest 15 periods. A fund with `cardFrom` (a year) keeps everything before that
   year off the card, because those rows are a predecessor or composite record and not the fund's own. */
const CARD_BARS=15;
const cardPerf=f=>{const all=[...(f.hist||[]),...f.perf];return(f.cardFrom?all.filter(p=>p[0]>=f.cardFrom):all).slice(-CARD_BARS)};
const liqTxt=f=>f.liq?L(f.liq):t("daily");
const veh=f=>f.vehicle==="private"?t("private"):f.vehicle;
// text typed by an admin or read from a deck is inserted into the page as HTML, so neutralise any markup first
const esc=s=>String(s==null?"":s).trim().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Investors (anyone who is not an admin) never see the real fund or manager name:
   the strategy label is shown as the fund's title instead. Admins see everything. */
const anon=()=>!Auth.isAdmin();
const title=f=>anon()?L(f.tag):f.name;
/* Deck-imported text can mention the fund or manager by name. For investors, mask the words the admin typed as the
   fund name and manager. This is best-effort: other names in the deck text (sister funds, vintages) are not caught. */
const R=(f,s)=>anon()&&f.redact&&f.redact.length&&s?s.replace(new RegExp(f.redact.join("|"),"gi"),"●●●"):s;
const trackHTML=f=>`<div class="trk"><div class="mini-label"><span>${t("trackRecord")}</span></div><ul>${notesOf(f).slice(0,6).map(x=>`<li>${R(f,x)}</li>`).join("")||"<li>—</li>"}</ul></div>`;

function ddText(f){                                     // max drawdown as a plain sentence, same style as other drawer text
  const d=f.dd, z=zh(), c=z?"：":": ", sep=z?"；":". ", end=z?"。":".";
  const wm=d.wm?`${d.since2020?t("wm20"):t("wm")}${c}${ym(d.wm[1])}${z?" ":", "}${fmt(d.wm[0])}`:"";   // funds added by form may have no worst month
  const wy=d.wy===false?"":d.wy?`${t("wy")}${c}${d.wy[1]}${z?"年 ":", "}${fmt(d.wy[0])}`:t("noNeg");      // wy:false = leave the worst-year sentence out
  return [wm,wy].filter(Boolean).join(sep)+end+(d.extra?(z?"":" ")+L(d.extra):"");
}

const track=document.getElementById("track"), prog=document.getElementById("prog");

/* My Focus List: each visitor keeps their own list of funds they like (the bookmark on a card, or the button in
   View Fund). It is kept in that visitor's browser only, never sent anywhere, and shows as the first tab while it
   holds at least one fund. Its cards come from every strategy. */
const FOCUS="focus";
const MyFocus=(()=>{
  const KEY="fundPitch.myFocus";
  let ids=[];
  try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))ids=saved.map(String)}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ids))}catch(e){}};       // private browsing may refuse: the list then lasts for this visit
  return {
    list:()=>ids.filter(id=>FundStore.find(id)),               // funds that are on the site right now, in the order they were saved
    has:id=>ids.includes(id),
    toggle(id){ids=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];save()}
  };
})();
const tabFunds=()=>tab===FOCUS?MyFocus.list().map(id=>FundStore.find(id).fund):(FUNDS[tab]||[]);   // the funds on screen
/* Top picks: funds the team rates most highly. An admin marks them with the star tool; every visitor then sees a gold
   star in the card's top-left corner, explained in a line under the cards. Shared like any other admin change. */
const PICK_STAR='<svg class="pick" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>';
/** On the Focus List, each card carries a tag naming the strategy the fund belongs to: "Liquid · Daily", "Royalty". */
function stratTag(f){
  if(tab!==FOCUS) return "";
  const hit=FundStore.find(f.id), s=hit&&FundStore.strategies().find(x=>x.id===hit.strat);
  return s?(s.group==="liquid"?t("grpLiquid")+" · ":"")+stratName(s):"";
}
const refreshOpenFund=id=>{if(openFund&&openFund.id===id){const hit=FundStore.find(id); if(hit) openD(openFund=hit.fund)}};   // redraw View Fund's buttons
/** Any visitor: put a fund on, or take it off, their own Focus List. */
function toggleSave(id){

}
/** Admin: mark a fund as a top pick, or clear the mark. */

  refreshOpenFund(id);
}
/* Funds added from a deck a moment ago: fund id -> when. Their cards show a gold outline that fades over a few
   seconds. The card is redrawn several times while the change is saved, so the outline picks up where it was. */
const justAdded=new Map(), ADDED_GLOW=3000;
function markJustAdded(id){ justAdded.set(id,Date.now()); setTimeout(()=>justAdded.delete(id),ADDED_GLOW); }
function cardHTML(f,i){
  const P=cardPerf(f), has=P.length>0;                               // deck-imported funds may have no yearly returns

  const bars=P.map(p=>`<div class="bar ${p[2]==="ytd"?"ytd":""}" data-v="${perLabel(p)}: ${fmt(p[1])}"><i class="${p[1]>=0?"p":"n"}" style="height:0" data-h="${Math.abs(p[1])/max*50}%"></i><em>${p[2]==="ytd"?"YTD":"'"+p[0].slice(2)}</em></div>`).join("");
  const a=has?ann(P):null, last=P.at(-1);
  const age=justAdded.has(f.id)?Date.now()-justAdded.get(f.id):-1;   // a card added moments ago keeps its fading outline across redraws
  return `<article class="card${age>=0?" just-added":""}"${age>=0?` style="animation-delay:-${age}ms"`:""}>
    <div class="card-top${Auth.isAdmin()?" has-tools":""}">${FundStore.isFeatured(f.id)?`<span class="pick-wrap">${PICK_STAR}<em>${t("pickLabel")}</em></span>`:""}${Auth.isAdmin()?`<div class="card-tools">
        <button class="tool star${FundStore.isFeatured(f.id)?" on":""}" data-star="${f.id}" title="${t(FundStore.isFeatured(f.id)?"pickRemove":"pickAdd")}" aria-label="${t(FundStore.isFeatured(f.id)?"pickRemove":"pickAdd")}" aria-pressed="${FundStore.isFeatured(f.id)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg></button>

        <button class="tool" data-edit="${f.id}" title="${t("edit")}" aria-label="${t("edit")}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>

const scroller=document.getElementById("scroller");

function renderCards(keepPos){
  const x=scroller.scrollLeft;
  track.innerHTML=tabFunds().map(cardHTML).join("")||`<p class="track-empty">${t("noFunds")}</p>`;   // a strategy with no funds yet
  const desc=tab===FOCUS?t("descFocus"):tab==="liquid"?t(anon()?"descLiquidAnon":"descLiquid"):tab==="illiquid"||tab==="monthly"?t("descIlliquid"):"";   // added strategies have no description line
  const picks=tabFunds().some(f=>FundStore.isFeatured(f.id));     // explain the star only when a card on screen carries one
  document.getElementById("tabDesc").innerHTML=(picks?`<span class="pick-note">${PICK_STAR}${t("pickNote")}</span>`:"")+(desc?`<span>${esc(desc)}</span>`:"");
  requestAnimationFrame(()=>setTimeout(()=>track.querySelectorAll(".bar i").forEach(b=>b.style.height=b.dataset.h),80));
  scroller.scrollLeft=keepPos?x:0;
  updateProg();
}
function updateProg(){
  const w=scroller.scrollWidth||1;
  prog.style.width=Math.min(100,scroller.clientWidth/w*100)+"%";
  prog.style.left=(scroller.scrollLeft/w*100)+"%";
  const max=scroller.scrollWidth-scroller.clientWidth, pager=document.getElementById("pager");
  pager.hidden=max<=1;                                                     // every card already fits: no buttons needed
  document.getElementById("prevBtn").disabled=scroller.scrollLeft<=1;
  document.getElementById("nextBtn").disabled=scroller.scrollLeft>=max-1;
}
scroller.addEventListener("scroll",updateProg,{passive:true});

/* previous / next buttons: each click moves the row by exactly one card */
const prevBtn=document.getElementById("prevBtn"), nextBtn=document.getElementById("nextBtn");
let pageTo=0, pageAt=0;
function page(dir){
  const first=track.firstElementChild; if(!first) return;
  const step=first.offsetWidth+(parseFloat(getComputedStyle(track).columnGap)||0);
  const max=scroller.scrollWidth-scroller.clientWidth;
  const from=performance.now()-pageAt<700?pageTo:scroller.scrollLeft;      // quick clicks add up instead of restarting mid-slide
  pageTo=Math.max(0,Math.min(max,(Math.round(from/step)+dir)*step));
  pageAt=performance.now();
  cancelAnimationFrame(glide); scroller.classList.remove("dragging");
  scroller.scrollTo({left:pageTo,behavior:"smooth"});
}
prevBtn.onclick=()=>page(-1);
nextBtn.onclick=()=>page(1);
addEventListener("resize",updateProg);

/* Changing language: the wording on the page fades out, is swapped while invisible, and fades back in, so the text
   does not jump. Clicking another language during the fade simply lands on the last one chosen. */
let langTimer=0, langNext="";
function setLanguage(code){
  if(!UI[code]||code===(langNext||lang)) return;
  try{localStorage.setItem("jc-lang",code)}catch(e){}
  if(calmMotion.matches){lang=code;applyLang();return}
  const fading=!!langNext;
  langNext=code;
  document.body.classList.add("lang-anim","lang-out");
  if(fading) return;                                           // already fading out: the swap below will use the newest choice
  clearTimeout(langTimer);
  langTimer=setTimeout(()=>{
    lang=langNext; langNext="";
    applyLang();
    document.body.classList.remove("lang-out");                // fade back in
    langTimer=setTimeout(()=>document.body.classList.remove("lang-anim"),320);
  },190);
}
document.querySelectorAll(".lang-menu button").forEach(b=>b.onclick=()=>{setMenu(false);setLanguage(b.dataset.lang)});
document.addEventListener("click",e=>{if(!langBox.contains(e.target))setMenu(false)});
addEventListener("keydown",e=>{if(e.key==="Escape")setMenu(false)});

/* ---------- strategy tabs ----------
   The tab row shows two fixed categories, Liquid and Closed-End / Semi-Liquid. Each strategy belongs to one of them:
   Daily, Monthly and Quarterly are built in (Liquid); the ones admins add say which category they are in. Moving the
   mouse over a category lists its strategies under the tab; clicking one shows that strategy's fund cards. `tab`
   holds the id of the strategy on screen. Admins get rename, delete and "+ Add Strategy" inside each list. */
const tabsEl=document.getElementById("tabs");
const GROUPS=[{id:"liquid",key:"grpLiquid"},{id:"closed",key:"grpClosed"}];
const BUILT_IN_NAME={liquid:"subDaily",monthly:"subMonthly",illiquid:"subQuarterly"};
const stratName=s=>s.builtIn&&!s.name?t(BUILT_IN_NAME[s.id]):s.name;   // a renamed built-in strategy shows the admin's name in every language
const stratLabel=s=>`${t(GROUPS.find(g=>g.id===s.group).key)} › ${stratName(s)}`;   // for the strategy pickers in Add Fund and Edit
let addingStrat="", renamingStrat="";                          // category a new strategy is being typed into; id of the strategy being renamed
let shownGroup="liquid", shownTab="liquid";                    // what the tab row showed last time it was drawn
let openGroup="", shutGroup="";                                // category whose list was opened by a click; category whose list stays closed until the mouse leaves
function renderTabs(){
  const list=FundStore.strategies(), admin=Auth.isAdmin();
  const focus=MyFocus.list();                                        // this visitor's own list
  if(tab===FOCUS?!focus.length:!list.some(s=>s.id===tab)) tab=list.length?list[0].id:"";   // the tab on screen is gone: fall back to the first strategy
  if(!admin) addingStrat="";
  if(!admin||!list.some(s=>s.id===renamingStrat)) renamingStrat="";
  const cur=list.find(s=>s.id===tab);
  const curGroup=tab===FOCUS?FOCUS:cur?cur.group:"";
  const newGroup=!!curGroup&&curGroup!==shownGroup, newTab=tab!==shownTab;   // animate the underline / the strategy name only when they change
  shownGroup=curGroup; shownTab=tab;
  const pencil=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>`;
  tabsEl.innerHTML=(focus.length?`<div class="tab-group"><button class="tab ${tab===FOCUS?"active":""}${tab===FOCUS&&newGroup?" moved":""}" data-focustab role="tab"><span>${t("focusTab")}</span><span class="count">${focus.length}</span></button></div>`:"")
   +GROUPS.map(g=>{
    const subs=list.filter(s=>s.group===g.id), on=!!cur&&cur.group===g.id;
    const total=subs.reduce((n,s)=>n+(FUNDS[s.id]||[]).length,0);
    const busy=addingStrat===g.id||subs.some(s=>s.id===renamingStrat);          // a form is open inside this list
    const items=subs.map(s=>s.id===renamingStrat
      ?`<form class="strat-new" id="stratRenameForm"><input id="stratRename" maxlength="40" value="${stratName(s)}" placeholder="${t("stratPh")}"><button class="btn sm solid" type="submit">${t("stratSave")}</button><button class="strat-x" type="button" id="stratRenameCancel" aria-label="${t("cancel")}">×</button></form>`
      :`<button class="sub ${s.id===tab?"active":""}" data-tab="${s.id}" role="menuitem"><span>${stratName(s)}</span><span class="count">${(FUNDS[s.id]||[]).length}</span>${admin?`<span class="tab-edit" data-rename="${s.id}" title="${t("stratRename")}">${pencil}</span><span class="tab-del" data-del="${s.id}" title="${t("stratDelete")}">×</span>`:""}</button>`).join("")
      +(!admin?"":addingStrat===g.id
        ?`<form class="strat-new" id="stratForm"><input id="stratName" maxlength="40" placeholder="${t("stratPh")}"><button class="btn sm solid" type="submit">${t("stratAdd")}</button><button class="strat-x" type="button" id="stratCancel" aria-label="${t("cancel")}">×</button></form>`
        :`<button class="tab-add" data-addstrat="${g.id}">${t("addStrategy")}</button>`);
    return `<div class="tab-group${busy||openGroup===g.id?" open":""}${shutGroup===g.id&&!busy?" shut":""}" data-group="${g.id}">
      <button class="tab ${on?"active":""}${on&&newGroup?" moved":""}${on&&newTab?" renamed":""}" data-grouptab="${g.id}" role="tab" aria-haspopup="true"><span>${t(g.key)}</span><span class="count">${total}</span>${on?`<span class="tab-sub">${stratName(cur)}</span>`:""}</button>
      <div class="tab-menu" role="menu">${items||`<p class="tab-empty">${t("grpEmpty")}</p>`}</div></div>`;
  }).join("");
}
/* Switching strategy: the cards on screen fade out and sink a little, the new ones are drawn, then they fade in and
   rise one after another. Skipped when the strategy does not change or the visitor asked for reduced motion. */
const calmMotion=matchMedia("(prefers-reduced-motion: reduce)");
let swapTimer=0;
function selectTab(id){
  const changed=id!==tab;
  tab=id; renderTabs();
  clearTimeout(swapTimer);
  if(!changed||calmMotion.matches){track.classList.remove("swap-out","swap-in");renderCards();return}
  track.classList.remove("swap-in"); track.classList.add("swap-out");
  swapTimer=setTimeout(()=>{
    renderCards();                                             // while invisible
    track.classList.remove("swap-out"); track.classList.add("swap-in");
    [...track.children].forEach((c,i)=>c.style.setProperty("--rise",Math.min(i,5)*55+"ms"));   // each card starts a touch after the one before
    swapTimer=setTimeout(()=>track.classList.remove("swap-in"),700);
  },170);
}

/** Creates a strategy from typed text, in a category ("liquid" or "closed"; funds from a deck default to "closed").
    Returns the new strategy, or null if the name is empty or already used. */
function createStrategy(raw,group){
  if(!Auth.isAdmin()||needToken()) return null;
  const name=esc(raw);
  if(!name) return null;
  if(FundStore.strategies().some(s=>stratName(s).toLowerCase()===name.toLowerCase())){alert(t("stratExists"));return null}
  return FundStore.addStrategy(name,group);
}
/** Saves a new name for a strategy tab. An empty name puts a built-in tab back to its original (translated) name. */
function renameStrategy(id,raw){
  if(!Auth.isAdmin()||needToken()) return false;
  const name=esc(raw), s=FundStore.strategies().find(x=>x.id===id);
  if(!s||(!name&&!s.builtIn)) return false;
  if(name===stratName(s)) return true;                          // unchanged
  if(name&&FundStore.strategies().some(x=>x.id!==id&&stratName(x).toLowerCase()===name.toLowerCase())){alert(t("stratExists"));return false}
  return FundStore.renameStrategy(id,name);
}
tabsEl.addEventListener("click",e=>{
  e.inTabs=true;                                               // for the outside-click handler: the clicked element may be redrawn before it runs
  const ren=e.target.closest("[data-rename]");
  if(ren){
    if(Auth.isAdmin()&&!needToken()){addingStrat="";renamingStrat=ren.dataset.rename;renderTabs();const box=document.getElementById("stratRename");box.focus();box.select()}
    return;
  }
  if(e.target.closest("#stratRenameCancel")){renamingStrat="";renderTabs();return}
  const del=e.target.closest("[data-del]");
  if(del){
    const id=del.dataset.del, s=FundStore.strategies().find(x=>x.id===id);
    if(s&&Auth.isAdmin()&&!needToken()&&confirm(t("stratDelConfirm")(del.parentElement.firstChild.textContent,(FUNDS[id]||[]).length))){
      FundStore.removeStrategy(id); closeD(); selectTab(tab);
    }
    return;
  }
  const add=e.target.closest("[data-addstrat]");
  if(add){addingStrat=add.dataset.addstrat;renamingStrat="";renderTabs();document.getElementById("stratName").focus();return}
  if(e.target.closest("#stratCancel")){addingStrat="";renderTabs();return}
  const b=e.target.closest("[data-tab]");
  if(b){shutGroup=b.closest(".tab-group").dataset.group;openGroup="";selectTab(b.dataset.tab);return}   // the list closes once a strategy is picked
  if(e.target.closest("[data-focustab]")){openGroup="";selectTab(FOCUS);return}
  const g=e.target.closest("[data-grouptab]");
  if(g){openGroup=openGroup===g.dataset.grouptab?"":g.dataset.grouptab;shutGroup="";renderTabs()}       // a click (or a tap on a touch screen) keeps the list open
});
/* the list disappears when the mouse leaves the category (mouseleave does not bubble, so it is caught on the way down) */
tabsEl.addEventListener("mouseleave",e=>{
  if(!e.target.classList||!e.target.classList.contains("tab-group")) return;
  shutGroup="";e.target.classList.remove("shut");
  if(openGroup===e.target.dataset.group){openGroup="";if(!addingStrat&&!renamingStrat)e.target.classList.remove("open")}
},true);
document.addEventListener("click",e=>{if(openGroup&&!e.inTabs){openGroup="";renderTabs()}});
tabsEl.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="stratRenameForm"){
    if(renameStrategy(renamingStrat,document.getElementById("stratRename").value)){renamingStrat="";applyLang()}
    return;
  }
  const s=createStrategy(document.getElementById("stratName").value,addingStrat);
  if(s){addingStrat="";selectTab(s.id)}
});
tabsEl.addEventListener("keydown",e=>{if(e.key==="Escape"&&(addingStrat||renamingStrat||openGroup)){addingStrat="";renamingStrat="";openGroup="";renderTabs()}});

/* mouse drag with momentum (touch uses native scrolling) */
let drag=null, glide=0, justDragged=false;
scroller.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse"||e.button!==0||e.target.closest("button"))return;
  cancelAnimationFrame(glide);
  drag={x:e.clientX,start:scroller.scrollLeft,lastX:e.clientX,lastT:performance.now(),v:0,moved:false};
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;
  if(!drag.moved&&Math.abs(dx)>4){drag.moved=true;scroller.classList.add("dragging")}
  if(!drag.moved)return;
  const now=performance.now(), dt=Math.max(1,now-drag.lastT);
  drag.v=0.8*((drag.lastX-e.clientX)/dt)+0.2*drag.v;   // px per ms, smoothed
  drag.lastX=e.clientX; drag.lastT=now;
  scroller.scrollLeft=drag.start-dx;
});
addEventListener("pointerup",()=>{
  if(!drag)return;
  const {moved}=drag; let v=drag.v*16; drag=null;
  if(!moved)return;
  justDragged=true; setTimeout(()=>justDragged=false,0);
  (function step(){                                     // decelerate, then let snap settle
    if(Math.abs(v)<0.5){scroller.classList.remove("dragging");return}
    scroller.scrollLeft+=v; v*=0.94; glide=requestAnimationFrame(step);
  })();
});
scroller.addEventListener("click",e=>{if(justDragged){e.preventDefault();e.stopPropagation()}},true);

/* Block trackpad swipe-to-go-back / forward (also covers Safari, which ignores overscroll-behavior for this).
   Horizontal wheel movement is allowed only while the fund carousel can still scroll that way. */
document.addEventListener("wheel",e=>{
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;            // vertical scrolling: leave alone
  const sc=e.target.closest&&e.target.closest("#scroller");
  if(sc){
    const max=sc.scrollWidth-sc.clientWidth;
    const canScroll=e.deltaX<0?sc.scrollLeft>0:sc.scrollLeft<max-1;
    if(canScroll)return;                                        // carousel handles it natively
  }
  e.preventDefault();                                           // at an edge or outside the carousel: swallow it
},{passive:false});

/* keyboard: hold ← / → to slide continuously; Home / End jump */
let keyDir=0, keyLoop=0, kv=0;
function keySlide(){                                    // held: steady speed; released: glide out
  if(keyDir) kv=keyDir*Math.max(Math.abs(kv),18); else kv*=0.9;
  if(Math.abs(kv)<0.5){kv=0;scroller.classList.remove("dragging");return}
  scroller.scrollLeft+=kv; keyLoop=requestAnimationFrame(keySlide);
}
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeD();return}
  if(drawer.classList.contains("on")||document.body.classList.contains("modal-open")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault();
    const d=e.key==="ArrowRight"?1:-1;
    if(keyDir!==d){keyDir=d;if(Math.sign(kv)!==d)kv=0;cancelAnimationFrame(glide);scroller.classList.add("dragging");cancelAnimationFrame(keyLoop);keySlide()}
  }
  if(e.key==="Home"&&document.activeElement===scroller){e.preventDefault();scroller.scrollTo({left:0,behavior:"smooth"})}
  if(e.key==="End"&&document.activeElement===scroller){e.preventDefault();scroller.scrollTo({left:scroller.scrollWidth,behavior:"smooth"})}
});
addEventListener("keyup",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft")keyDir=0});
addEventListener("blur",()=>keyDir=0);

/* ---------- monthly returns ----------
   A fund can carry `monthly`: [{ y:"2008", m:[12 numbers or null], t: year total or null }], read from a picture the
   admin attached (scripts/picture_tables.py). It holds numbers only, so it is safe to show and download for investors. */
const moNum=(v,d)=>v==null?"":(v<0?"−":"")+Math.abs(v).toFixed(d)+"%";
const moDecimals=v=>(String(v).split(".")[1]||"").length>1?2:1;
/** Years whose twelve months do not compound to the printed year total: a hint that a figure was misread. */
function monthlySuspects(rows){
  return rows.filter(r=>r.t!=null&&r.m.every(v=>v!=null)&&Math.abs((r.m.reduce((a,v)=>a*(1+v/100),1)-1)*100-r.t)>0.15).map(r=>r.y);
}
/** A small picture of the table: one tiny cell per month, navy for gains and red for losses. */
function monthlyThumb(rows){
  const show=rows.slice(-14), peak=Math.max(1,...show.flatMap(r=>r.m.filter(v=>v!=null).map(Math.abs)).map(v=>Math.min(v,5)));
  const cells=show.map((r,y)=>r.m.map((v,x)=>v==null?"":`<rect x="${x*7}" y="${y*5}" width="6" height="4" fill="${v<0?"#b4443a":"#1A2445"}" opacity="${(0.25+0.75*Math.min(Math.abs(v),5)/peak).toFixed(2)}"/>`).join("")).join("");
  return `<svg class="mo-pic" viewBox="0 0 83 ${show.length*5-1}" width="83" height="${show.length*5-1}" aria-hidden="true">${cells}</svg>`;
}
const monthNames=()=>zh()?MON.map((_,i)=>`${i+1}月`):MON;
/* Windows (Add Fund, Edit, the monthly table) open with a fade while the panel rises, and close the same way.
   Opening is pure CSS (it plays whenever `hidden` is removed); closing keeps the window on screen for the length of
   the fade-out (class "closing"), then sets `hidden`. */
const modalTimers=new WeakMap();
function setModal(el,show){
  clearTimeout(modalTimers.get(el)); el.classList.remove("closing");
  if(show){el.hidden=false;return}
  if(el.hidden) return;

  el.classList.add("closing");
  modalTimers.set(el,setTimeout(()=>{el.hidden=true;el.classList.remove("closing")},230));
}
const moModal=document.getElementById("monthlyModal");

    rows.map(r=>`<tr${bad.includes(r.y)?' class="check"':""}><td>${r.y}</td>${r.m.map(v=>`<td class="${v<0?"neg":""}">${moNum(v,2)}</td>`).join("")}<td class="${r.t<0?"neg":""}">${moNum(r.t,r.t==null?1:moDecimals(r.t))}</td></tr>`).join("")}</table>`;

function openD(f){

    <table class="perf"><tr><th>${t("period")}</th><th>${t("ret")}</th></tr>${rows.map(p=>`<tr><td>${perLabel(p)}</td><td class="${p[1]>=0?"pos":"neg"}">${fmt(p[1])}</td></tr>`).join("")}</table>`:"";

      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7h10M8 3l4 4-4 4"/></svg></button>`:"";
  const cls=classesOf(f);

    ${Auth.isAdmin()?`<div class="d-admin"><button class="btn ghost" onclick="openEdit('${f.id}')">${t("edit")}</button><button class="btn ghost" onclick="togglePick('${f.id}')">${t(FundStore.isFeatured(f.id)?"pickRemove":"pickAdd")}</button>${f.custom?`<button class="btn ghost" onclick="translateNow('${f.id}')">${t(f.translated?"retranslate":"translate")}</button>`:""}<button class="btn danger" onclick="deleteFund('${f.id}')">${t("del")}</button></div>`:""}
  </div>`;
  drawer.classList.add("on");scrim.classList.add("on");drawer.setAttribute("aria-hidden","false");drawer.scrollTop=keep;
}

scrim.onclick=closeD;

/* nav: highlight the link for the section currently in view */

function spy(){

navLinks.forEach(a=>a.addEventListener("click",e=>{

addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("solid",scrollY>40));
