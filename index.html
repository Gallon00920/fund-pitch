<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alternative Investments | Fund Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=202611251443">
</head>
<body>

<nav id="nav">
  <div class="wrap">
    <a href="#" class="logo"><span class="wordmark" data-i="division"></span></a>
    <div class="links"><a href="#about" class="on" data-sec="about" data-i="navAbout"></a><a href="#funds" data-sec="funds" data-i="navFunds"></a><a href="#contact" data-sec="contact" data-i="navContact"></a></div>
    <div class="nav-right">
      <button class="btn sm" id="addFundBtn" data-i="addFund" hidden></button>
      <div class="lang" id="lang">
        <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.6 4 6 4 9.5s-1.4 6.9-4 9.5c-2.6-2.6-4-6-4-9.5s1.4-6.9 4-9.5z"/></svg>
          <span id="langCur">EN</span>
          <svg class="chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5 5 6.5 8 3.5"/></svg>
        </button>
        <ul class="lang-menu" role="menu">
          <li><button role="menuitemradio" data-lang="en">English <small>EN</small></button></li>
          <li><button role="menuitemradio" data-lang="sc">简体中文 <small>简</small></button></li>
          <li><button role="menuitemradio" data-lang="tc">繁體中文 <small>繁</small></button></li>
        </ul>
      </div>
      <button class="acct" id="acctBtn"></button>
    </div>
  </div>
</nav>

<header class="hero" id="about">
  <svg class="lines" viewBox="0 0 600 300" fill="none">
    <path d="M0 250 C120 230 160 180 240 170 S380 120 440 90 S560 40 600 30" stroke="#DAB56E" stroke-width="1"/>
    <path d="M0 270 C140 260 180 220 260 210 S400 170 460 140 S560 100 600 90" stroke="#3a4a7d" stroke-width="1"/>
    <path d="M0 290 C150 285 200 260 280 250 S420 220 480 200 S560 170 600 160" stroke="#2b3866" stroke-width="1"/>
  </svg>
  <div class="wrap">
    <div class="eyebrow" data-i="heroEyebrow"></div>
    <h1 data-i="heroTitle"></h1>
    <p data-i="heroBody"></p>
    <div class="hero-stats">
      <div><b>130+</b><span data-i="stPipeline"></span></div>
      <div><b>40+</b><span data-i="stGPs"></span></div>
      <div><b>9</b><span data-i="stCategories"></span></div>
    </div>
  </div>
</header>

<section class="funds" id="funds">
  <div class="wrap">
    <div class="sec-head reveal">
      <div><div class="eyebrow" data-i="secEyebrow"></div><h2 data-i="secTitle"></h2></div>
      <p data-i="secBody"></p>
    </div>
    <div class="tabbar reveal">
      <div class="tabs" id="tabs" role="tablist"></div>   <!-- filled by renderTabs() in js/app.js -->
    </div>
    <div class="track-outer" id="scroller" tabindex="0" aria-label="Funds"><div class="track" id="track"></div></div>
    <div class="progress"><i id="prog"></i></div>
    <p class="tab-desc" id="tabDesc"></p>
    <button class="restore" id="restoreBtn" type="button" data-i="restore" hidden></button>
  </div>
</section>

<footer id="contact">
  <div class="wrap">
    <div><span class="wordmark" data-i="division"></span></div>
    <div data-i="disclaimer"></div>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- Login screen (shown first when CONFIG.REQUIRE_LOGIN is true) -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="wordmark" data-i="division"></div>
    <h2 data-i="loginTitle"></h2>
    <p data-i="loginSub"></p>
    <label><span data-i="username"></span><input id="loginUser" name="username" autocomplete="username" required></label>
    <label><span data-i="password"></span><input id="loginPass" name="password" type="password" autocomplete="current-password" required></label>
    <p class="form-err" id="loginErr" hidden></p>
    <button class="btn solid" type="submit" data-i="signIn"></button>
    <button class="link-btn" type="button" id="loginCancel" data-i="cancel" hidden></button>
    <div class="login-lang"><button type="button" data-lang="en">English</button><button type="button" data-lang="sc">简体中文</button><button type="button" data-lang="tc">繁體中文</button></div>
  </form>
</div>

<!-- Add Funds from a PPTX deck (admin only) -->
<div class="modal" id="fundModal" hidden>
  <form class="modal-card" id="fundForm" novalidate>
    <div class="modal-head"><h3 data-i="imTitle"></h3><button class="close" type="button" id="fundClose" aria-label="Close">✕</button></div>
    <div class="im-body">
      <p class="im-intro" data-i="imIntro"></p>
      <label class="im-file" id="dropZone">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
        <b data-i="imDrop"></b>
        <span data-i="imChoose"></span>
        <input id="fundFile" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation"></label>
      <p class="im-status" id="imStatus"></p>
      <div class="im-strat" id="imStratRow" hidden>
        <label><span data-i="imNewStrat"></span><input id="imStratName" maxlength="40" data-ph="stratPh"></label>
        <button class="btn sm ghost" type="button" id="imStratCreate" data-i="imCreate"></button>
      </div>
      <div id="imList"></div>
      <details class="im-key" id="ghBox">
        <summary data-i="ghTitle"></summary>
        <p data-i="ghHelp"></p>
        <div class="im-strat">
          <label><span data-i="ghLabel"></span><input id="ghInput" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
          <button class="btn sm ghost" type="button" id="ghSave" data-i="ghSave"></button>
          <button class="btn sm ghost" type="button" id="ghRemove" data-i="ghRemove" hidden></button>
        </div>
        <p class="im-status" id="ghStatus"></p>
      </details>
    </div>
    <div class="modal-foot">
      <p class="form-err" id="fundErr" hidden></p>
      <button class="btn ghost" type="button" id="fundCancel" data-i="cancel"></button>
      <button class="btn solid" type="submit" id="imSubmit" data-i="imAdd" hidden></button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- Edit Fund form (admin only) -->
<div class="modal" id="editModal" hidden>
  <form class="modal-card" id="editForm" novalidate>
    <div class="modal-head"><h3 data-i="efTitle"></h3><button class="close" type="button" id="editClose" aria-label="Close">✕</button></div>
    <div class="modal-body">
      <label><span data-i="afName"></span><input id="efName" maxlength="80"></label>
      <label><span data-i="afCategory"></span><select id="efStrat"></select></label>
      <label><span data-i="afMgr"></span><input id="efMgr" maxlength="60"></label>
      <label><span data-i="afTag"></span><input id="efTag" maxlength="80"></label>
      <label><span data-i="afVehicle"></span><input id="efVehicle" maxlength="40"></label>
      <label><span data-i="afLiq"></span><input id="efLiq" maxlength="60"></label>
      <label><span data-i="efInception"></span><input id="efInception" type="month"></label>
      <label><span data-i="efInceptionText"></span><input id="efInceptionText" maxlength="200"></label>
      <label><span data-i="efAum"></span><input id="efAum" type="number" step="0.001" min="0"></label>
      <label><span data-i="efAumText"></span><input id="efAumText" maxlength="120"></label>
      <label class="wide"><span data-i="afStrategy"></span><textarea id="efStrategy" maxlength="600"></textarea></label>
      <label class="wide"><span data-i="efReturns"></span><textarea id="efReturns" rows="7"></textarea><small data-i="efReturnsHelp"></small></label>
      <label><span data-i="efTarget"></span><input id="efTarget" maxlength="40"></label>
      <label><span data-i="imHide"></span><input id="efHide" maxlength="300"></label>
      <label class="wide"><span data-i="efNotes"></span><textarea id="efNotes" rows="4"></textarea></label>
      <label class="wide"><span data-i="efDd"></span><textarea id="efDd" rows="3"></textarea></label>
      <label class="wide"><span data-i="efLiqFull"></span><textarea id="efLiqFull" rows="3"></textarea></label>
      <label class="wide"><span data-i="efNote"></span><textarea id="efNote" rows="3"></textarea></label>
    </div>
    <div class="modal-foot">
      <p class="form-err" id="editErr" hidden></p>
      <button class="btn ghost" type="button" id="editCancel" data-i="cancel"></button>
      <button class="btn solid" type="submit" data-i="efSave"></button>
    </div>
  </form>
</div>

<!-- Scripts load in this order on purpose: settings, wording, data, storage, auth, then the page logic.
     The ?v= number makes browsers fetch fresh copies. Change it (all at once) whenever these files change,
     otherwise a browser can mix an old script with a new page and the funds will not show. -->
<script src="js/config.js?v=202611251443"></script>
<script src="js/i18n.js?v=202611251443"></script>
<script src="js/funds-data.js?v=202611251443"></script>
<script src="js/fund-store.js?v=202611251443"></script>
<script src="js/auth.js?v=202611251443"></script>
<script src="js/app.js?v=202611251443"></script>
<script src="js/account.js?v=202611251443"></script>
<script src="js/pptx-reader.js?v=202611251443"></script>
<script src="js/add-fund.js?v=202611251443"></script>
<script src="js/edit-fund.js?v=202611251443"></script>
<script src="js/repo.js?v=202611251443"></script>
<script src="js/reorder.js?v=202611251443"></script>
</body>
</html>
